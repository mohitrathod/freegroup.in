    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #1d2722;
        background: #f5f4ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        place-items: center;
      }

      main {
        width: min(100%, 440px);
        text-align: center;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .home-link {
        display: inline-block;
        margin-bottom: 25px;
        color: #68716b;
        font-size: 13px;
        font-weight: 700;
      }

      .home-link:hover {
        color: #2b664c;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #2b664c;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.5px;
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 10vw, 48px);
        letter-spacing: -2px;
      }

      .intro {
        margin: 10px 0 24px;
        color: #68716b;
        font-size: 14px;
        line-height: 1.6;
      }

      .coin-button {
        position: relative;
        display: block;
        width: clamp(150px, 45vw, 190px);
        aspect-ratio: 1;
        margin: 0 auto 20px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        perspective: 700px;
        -webkit-tap-highlight-color: transparent;
      }

      .coin-button:focus-visible,
      .action:focus-visible,
      .home-link:focus-visible {
        outline: 3px solid #2b664c;
        outline-offset: 5px;
      }

      .coin {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border: 10px solid #d5a934;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffe795, #efc34f 70%);
        box-shadow: inset 0 0 0 4px #f8df98, 0 14px 28px #1d272222;
        transform-style: preserve-3d;
        transition: transform 850ms cubic-bezier(.15, .75, .22, 1);
        will-change: transform;
      }

      .coin-face {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #765a1d;
        font-size: clamp(54px, 16vw, 72px);
        font-weight: 900;
        backface-visibility: hidden;
      }

      .coin-back {
        transform: rotateY(180deg);
      }

      .coin-label {
        position: absolute;
        bottom: 28px;
        color: #765a1d;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 2px;
      }

      .result {
        min-height: 26px;
        margin: 0 0 18px;
        color: #2b664c;
        font-size: 18px;
        font-weight: 800;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .action {
        min-height: 46px;
        padding: 0 18px;
        border: 0;
        border-radius: 6px;
        background: #1d2722;
        color: white;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
      }

      .action:hover:not(:disabled) {
        background: #2b664c;
      }

      .action:disabled {
        cursor: wait;
        opacity: .65;
      }

      .action-secondary {
        border: 1px solid #dedfd6;
        background: transparent;
        color: #68716b;
      }

      .action-secondary:hover:not(:disabled) {
        background: #e8e8df;
        color: #1d2722;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 25px;
        padding: 15px;
        border: 1px solid #dedfd6;
        border-radius: 10px;
        background: #ffffff80;
      }

      .stat-value {
        display: block;
        font-size: 20px;
        font-weight: 800;
      }

      .stat-label {
        display: block;
        margin-top: 3px;
        color: #68716b;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .8px;
        text-transform: uppercase;
      }

      @media (prefers-reduced-motion: reduce) {
        .coin {
          transition-duration: .01ms;
        }
      }

  <body>
    <main>
      <a class="home-link" href="../index.html">← Back to FreeGroup</a>
      <p class="eyebrow">A LITTLE DECISION HELPER</p>
      <h1>Coin Flip</h1>
      <p class="intro">Need a quick tiebreaker? Give the coin a tap.</p>

      <button class="coin-button" id="coin-button" type="button" aria-label="Flip the coin">
        <span class="coin" id="coin" aria-hidden="true">
          <span class="coin-face coin-front">H<span class="coin-label">HEADS</span></span>
          <span class="coin-face coin-back">T<span class="coin-label">TAILS</span></span>
        </span>
      </button>
      <p class="result" id="result" aria-live="polite">Tap the coin or button to flip.</p>

      <div class="actions">
        <button class="action" id="flip-button" type="button">Flip coin</button>
        <button class="action action-secondary" id="reset-button" type="button">Reset stats</button>
      </div>

      <div class="stats" aria-label="Flip statistics">
        <div><span class="stat-value" id="total">0</span><span class="stat-label">Flips</span></div>
        <div><span class="stat-value" id="heads">0</span><span class="stat-label">Heads</span></div>
        <div><span class="stat-value" id="tails">0</span><span class="stat-label">Tails</span></div>
      </div>
    </main>

    <script>
      const coin = document.getElementById("coin");
      const coinButton = document.getElementById("coin-button");
      const flipButton = document.getElementById("flip-button");
      const resetButton = document.getElementById("reset-button");
      const result = document.getElementById("result");
      const totalDisplay = document.getElementById("total");
      const headsDisplay = document.getElementById("heads");
      const tailsDisplay = document.getElementById("tails");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const animationDuration = reducedMotion ? 0 : 850;
      let total = 0;
      let heads = 0;
      let tails = 0;
      let flipping = false;

      function updateStats() {
        totalDisplay.textContent = String(total);
        headsDisplay.textContent = String(heads);
        tailsDisplay.textContent = String(tails);
      }

      function flipCoin() {
        if (flipping) return;
        flipping = true;
        flipButton.disabled = true;
        resetButton.disabled = true;
        coinButton.disabled = true;
        result.textContent = "Flipping…";

        const isHeads = Math.random() < 0.5;
        const turn = isHeads ? 8 : 8.5;
        coin.style.transitionDuration = "0ms";
        coin.style.transform = "rotateY(0deg)";
        void coin.offsetWidth;
        coin.style.transitionDuration = `${animationDuration}ms`;
        coin.style.transform = `rotateY(${turn * 360}deg)`;

        window.setTimeout(() => {
          if (isHeads) heads++;
          else tails++;
          total++;
          updateStats();
          result.textContent = `It’s ${isHeads ? "heads" : "tails"}!`;
          flipping = false;
          flipButton.disabled = false;
          resetButton.disabled = false;
          coinButton.disabled = false;
        }, animationDuration);
      }

      function resetStats() {
        total = 0;
        heads = 0;
        tails = 0;
        updateStats();
        result.textContent = "Stats reset. Flip whenever you’re ready.";
      }

      coinButton.addEventListener("click", flipCoin);
      flipButton.addEventListener("click", flipCoin);
      resetButton.addEventListener("click", resetStats);
    </script>
  </body>
