<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#7cdbf1">
    <title>Tiny Aquarium — FreeGroup</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #7cdbf1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 100%;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
      }

      .tank {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 108%, #35a997 0, transparent 38%),
          linear-gradient(180deg, #7cdbf1 0%, #b8eff2 58%, #d4f1dc 100%);
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .tank:focus-visible {
        outline: 4px solid #fff4b8;
        outline-offset: -6px;
      }

      .sunlight {
        position: absolute;
        top: -20%;
        left: 18%;
        width: 64%;
        height: 85%;
        background: linear-gradient(160deg, #fff8cc4d, transparent 65%);
        clip-path: polygon(20% 0, 100% 0, 72% 100%, 0 100%);
        pointer-events: none;
      }

      .bubbles {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .bubble {
        position: absolute;
        bottom: -30px;
        left: var(--left);
        width: var(--size);
        aspect-ratio: 1;
        border: 2px solid #ffffff70;
        border-radius: 50%;
        animation: rise var(--duration) var(--delay) ease-in infinite;
      }

      .fish {
        position: absolute;
        z-index: 1;
        font-size: clamp(44px, 12vw, 72px);
        line-height: 1;
        pointer-events: none;
        animation: swim var(--duration) ease-in-out forwards;
        will-change: transform, opacity;
      }

      .home-link {
        position: absolute;
        z-index: 2;
        top: max(16px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 14px;
        border: 1px solid #ffffff80;
        border-radius: 24px;
        background: #ffffff70;
        color: #15576b;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        touch-action: manipulation;
      }

      .home-link:focus-visible {
        outline: 3px solid #15576b;
        outline-offset: 3px;
      }

      .hint {
        position: absolute;
        z-index: 2;
        right: 16px;
        bottom: max(18px, env(safe-area-inset-bottom));
        left: 16px;
        margin: 0;
        color: #15576b;
        font-size: clamp(16px, 4vw, 20px);
        font-weight: 800;
        text-align: center;
        text-shadow: 0 1px 0 #ffffffa6;
        pointer-events: none;
      }

      @keyframes swim {
        0% {
          transform: translateX(0) scaleX(var(--facing));
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateX(var(--distance)) scaleX(var(--facing));
          opacity: 0;
        }
      }

      @keyframes rise {
        from {
          transform: translateY(0);
          opacity: 0;
        }
        15% {
          opacity: .7;
        }
        to {
          transform: translateY(-110vh);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bubble {
          animation: none;
          opacity: .35;
        }

        .fish {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="tank" id="tank" tabindex="0" aria-label="Aquarium. Tap anywhere in the water to add a fish.">
      <div class="sunlight" aria-hidden="true"></div>
      <div class="bubbles" aria-hidden="true">
        <span class="bubble" style="--left: 9%; --size: 16px; --duration: 7s; --delay: -2s"></span>
        <span class="bubble" style="--left: 24%; --size: 10px; --duration: 9s; --delay: -6s"></span>
        <span class="bubble" style="--left: 43%; --size: 20px; --duration: 8s; --delay: -3s"></span>
        <span class="bubble" style="--left: 66%; --size: 12px; --duration: 10s; --delay: -5s"></span>
        <span class="bubble" style="--left: 85%; --size: 18px; --duration: 7s; --delay: -1s"></span>
      </div>
      <a class="home-link" href="../index.html">← FreeGroup</a>
      <p class="hint" id="hint">Tap the water to add a fish!</p>
    </main>

    <script>
      const tank = document.getElementById("tank");
      const fishTypes = ["🐠", "🐟", "🐡", "🐬"];
      const maxFish = 24;

      function addFish(x, y) {
        const existingFish = tank.querySelectorAll(".fish");
        if (existingFish.length >= maxFish) existingFish[0].remove();

        const fish = document.createElement("span");
        const direction = Math.random() < 0.5 ? -1 : 1;
        const bounds = tank.getBoundingClientRect();
        fish.className = "fish";
        fish.textContent = fishTypes[Math.floor(Math.random() * fishTypes.length)];
        fish.setAttribute("aria-hidden", "true");
        fish.style.left = `${Math.max(20, Math.min(x, bounds.width - 20))}px`;
        fish.style.top = `${Math.max(48, Math.min(y, bounds.height - 70))}px`;
        fish.style.setProperty("--facing", String(direction));
        fish.style.setProperty("--distance", `${direction * bounds.width}px`);
        fish.style.setProperty("--duration", `${8 + Math.random() * 5}s`);
        fish.addEventListener("animationend", () => fish.remove(), { once: true });
        tank.append(fish);
      }

      tank.addEventListener("pointerdown", (event) => {
        if (event.target.closest("a")) return;
        const bounds = tank.getBoundingClientRect();
        addFish(event.clientX - bounds.left, event.clientY - bounds.top);
      });

      tank.addEventListener("keydown", (event) => {
        if (event.target !== tank || (event.key !== "Enter" && event.key !== " ")) return;
        event.preventDefault();
        addFish(tank.clientWidth / 2, tank.clientHeight / 2);
      });

      [
        [0.2, 0.34],
        [0.68, 0.47],
        [0.43, 0.69]
      ].forEach(([x, y]) => {
        addFish(window.innerWidth * x, window.innerHeight * y);
      });
    </script>
  </body>
</html>
