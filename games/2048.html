<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#faf8ef">
    <title>2048 — FreeGroup</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #776e65;
        background: #faf8ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
      }

      main {
        width: min(100%, 520px);
        margin: 0 auto;
        padding: 22px 18px 36px;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .topbar,
      .score-row,
      .game-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .home-link {
        font-size: 14px;
        font-weight: 700;
      }

      .home-link:hover {
        color: #2b664c;
      }

      h1 {
        margin: 26px 0 0;
        color: #776e65;
        font-size: clamp(52px, 15vw, 76px);
        font-weight: 800;
        letter-spacing: -5px;
        line-height: 1;
      }

      .tagline {
        margin: 4px 0 18px;
        font-size: 14px;
      }

      .score-row {
        margin-bottom: 12px;
      }

      .scores {
        display: flex;
        gap: 8px;
      }

      .score-card {
        min-width: 76px;
        padding: 6px 12px;
        border-radius: 6px;
        background: #bbada0;
        color: white;
        text-align: center;
      }

      .score-label {
        display: block;
        color: #eee4da;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .score-value {
        font-size: 20px;
        font-weight: 800;
        line-height: 1.15;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: #8f7a66;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #edc22e;
        outline-offset: 3px;
      }

      .new-game {
        min-height: 44px;
        padding: 0 14px;
      }

      .board {
        display: grid;
        width: 100%;
        aspect-ratio: 1;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(0, 1fr));
        gap: clamp(7px, 2vw, 12px);
        padding: clamp(8px, 2.4vw, 14px);
        border-radius: 8px;
        background: #bbada0;
        touch-action: none;
        user-select: none;
      }

      .tile {
        display: grid;
        min-width: 0;
        place-items: center;
        border-radius: 6px;
        background: #cdc1b4;
        color: #776e65;
        font-size: clamp(23px, 8vw, 40px);
        font-weight: 800;
      }

      .tile[data-value="2"] { background: #eee4da; }
      .tile[data-value="4"] { background: #ede0c8; }
      .tile[data-value="8"] { background: #f2b179; color: white; }
      .tile[data-value="16"] { background: #f59563; color: white; }
      .tile[data-value="32"] { background: #f67c5f; color: white; }
      .tile[data-value="64"] { background: #f65e3b; color: white; }
      .tile[data-value="128"],
      .tile[data-value="256"],
      .tile[data-value="512"] {
        background: #edc850;
        color: white;
        font-size: clamp(19px, 6.5vw, 32px);
      }
      .tile[data-value="1024"],
      .tile[data-value="2048"] {
        background: #edc22e;
        color: white;
        font-size: clamp(16px, 5.2vw, 26px);
      }
      .tile[data-value="0"] {
        color: transparent;
      }

      .game-heading {
        margin: 14px 0 0;
      }

      .status {
        min-height: 22px;
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }

      .directions {
        display: grid;
        grid-template:
          ". up ." 44px
          "left down right" 44px
          / 44px 44px 44px;
        justify-content: center;
        gap: 6px;
        margin: 12px auto 0;
      }

      .direction {
        font-size: 19px;
      }

      .direction[data-direction="up"] { grid-area: up; }
      .direction[data-direction="left"] { grid-area: left; }
      .direction[data-direction="down"] { grid-area: down; }
      .direction[data-direction="right"] { grid-area: right; }

      .instructions {
        margin: 14px 0 0;
        color: #8f8276;
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
      }

      @media (max-width: 360px) {
        main {
          padding-right: 12px;
          padding-left: 12px;
        }

        .score-card {
          min-width: 66px;
          padding-right: 8px;
          padding-left: 8px;
        }

        .new-game {
          padding: 0 10px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <a class="home-link" href="../index.html">← FreeGroup</a>
        <span>PUZZLE</span>
      </div>
      <h1>2048</h1>
      <p class="tagline">Join the tiles. Can you reach 2048?</p>

      <div class="score-row">
        <div class="scores" aria-label="Scores">
          <div class="score-card">
            <span class="score-label">Score</span>
            <span class="score-value" id="score">0</span>
          </div>
          <div class="score-card">
            <span class="score-label">Best</span>
            <span class="score-value" id="best">0</span>
          </div>
        </div>
        <button class="new-game" id="new-game" type="button">New game</button>
      </div>

      <div class="board" id="board" role="grid" aria-label="2048 game board"></div>
      <div class="game-heading">
        <p class="status" id="status" aria-live="polite">Swipe or use the arrow keys to play.</p>
      </div>

      <div class="directions" aria-label="Move tiles">
        <button class="direction" type="button" data-direction="up" aria-label="Move up">↑</button>
        <button class="direction" type="button" data-direction="left" aria-label="Move left">←</button>
        <button class="direction" type="button" data-direction="down" aria-label="Move down">↓</button>
        <button class="direction" type="button" data-direction="right" aria-label="Move right">→</button>
      </div>
      <p class="instructions">Swipe on the board, tap the arrows, or use your keyboard. Matching tiles merge.</p>
    </main>

    <script>
      const SIZE = 4;
      const boardElement = document.getElementById("board");
      const scoreElement = document.getElementById("score");
      const bestElement = document.getElementById("best");
      const statusElement = document.getElementById("status");
      let board = [];
      let score = 0;
      let best = Number(localStorage.getItem("freegroup-2048-best")) || 0;
      let gameOver = false;
      let reached2048 = false;
      let touchStart = null;

      function render() {
        boardElement.replaceChildren();
        board.forEach((value) => {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.dataset.value = String(value);
          tile.setAttribute("role", "gridcell");
          tile.setAttribute("aria-label", value ? `Tile ${value}` : "Empty");
          tile.textContent = value ? String(value) : "";
          boardElement.append(tile);
        });
        scoreElement.textContent = String(score);
        bestElement.textContent = String(best);
      }

      function addTile() {
        const empty = board.reduce((cells, value, index) => {
          if (value === 0) cells.push(index);
          return cells;
        }, []);
        if (empty.length === 0) return;
        const index = empty[Math.floor(Math.random() * empty.length)];
        board[index] = Math.random() < 0.9 ? 2 : 4;
      }

      function startGame() {
        board = Array(SIZE * SIZE).fill(0);
        score = 0;
        gameOver = false;
        reached2048 = false;
        addTile();
        addTile();
        statusElement.textContent = "Swipe or use the arrow keys to play.";
        render();
      }

      function lineIndices(direction, line) {
        return Array.from({ length: SIZE }, (_, step) => {
          const row = direction === "down" ? SIZE - 1 - step : step;
          const col = direction === "right" ? SIZE - 1 - step : step;
          if (direction === "up" || direction === "down") {
            return row * SIZE + line;
          }
          return line * SIZE + col;
        });
      }

      function canMove() {
        if (board.includes(0)) return true;
        for (let row = 0; row < SIZE; row++) {
          for (let col = 0; col < SIZE; col++) {
            const value = board[row * SIZE + col];
            if (col < SIZE - 1 && value === board[row * SIZE + col + 1]) return true;
            if (row < SIZE - 1 && value === board[(row + 1) * SIZE + col]) return true;
          }
        }
        return false;
      }

      function move(direction) {
        if (gameOver) return;
        const previous = board.slice();

        for (let line = 0; line < SIZE; line++) {
          const indices = lineIndices(direction, line);
          const values = indices.map((index) => board[index]).filter(Boolean);
          const merged = [];
          for (let index = 0; index < values.length; index++) {
            if (values[index] === values[index + 1]) {
              const value = values[index] * 2;
              merged.push(value);
              score += value;
              index++;
            } else {
              merged.push(values[index]);
            }
          }
          while (merged.length < SIZE) merged.push(0);
          indices.forEach((index, offset) => {
            board[index] = merged[offset];
          });
        }

        if (board.every((value, index) => value === previous[index])) return;

        if (score > best) {
          best = score;
          localStorage.setItem("freegroup-2048-best", String(best));
        }
        addTile();

        if (!reached2048 && board.includes(2048)) {
          reached2048 = true;
          statusElement.textContent = "You made 2048! Keep going or start a new game.";
        } else if (!canMove()) {
          gameOver = true;
          statusElement.textContent = "No moves left. Start a new game to try again.";
        }
        render();
      }

      document.getElementById("new-game").addEventListener("click", startGame);
      document.querySelectorAll("[data-direction]").forEach((button) => {
        button.addEventListener("click", () => move(button.dataset.direction));
      });

      document.addEventListener("keydown", (event) => {
        const directions = {
          ArrowUp: "up",
          ArrowLeft: "left",
          ArrowDown: "down",
          ArrowRight: "right"
        };
        const direction = directions[event.key];
        if (direction) {
          event.preventDefault();
          move(direction);
        }
      });

      boardElement.addEventListener("pointerdown", (event) => {
        touchStart = { x: event.clientX, y: event.clientY };
      });
      boardElement.addEventListener("pointerup", (event) => {
        if (!touchStart) return;
        const deltaX = event.clientX - touchStart.x;
        const deltaY = event.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < 24) return;
        move(
          Math.abs(deltaX) > Math.abs(deltaY)
            ? deltaX > 0 ? "right" : "left"
            : deltaY > 0 ? "down" : "up"
        );
      });
      boardElement.addEventListener("pointercancel", () => {
        touchStart = null;
      });

      startGame();
    </script>
  </body>
</html>
