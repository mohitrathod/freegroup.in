<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; align-items: center; }
  .hud span b { color: #6ee7f9; }
  .wrap { position: relative; }
  canvas { background: #05070f; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 0 60px rgba(167,139,250,0.08); touch-action: none; max-width: 100%; display: block; }
  button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8; padding: 8px 18px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  button:hover { background: rgba(110,231,249,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; text-align: center; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(9,11,20,0.82); border-radius: 12px; }
  #overlay.show { display: flex; }
  #overlay .panel { text-align: center; padding: 24px 32px; }
  #overlay h2 { font-size: 1.8rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 16px; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Asteroids</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
    <span>Lives: <b id="lives">3</b></span>
    <button id="mute">Sound: On</button>
  </div>
  <div class="wrap">
    <canvas id="game" width="560" height="440"></canvas>
    <div id="overlay"><div class="panel"><h2>Game Over</h2><p id="oText">Score: 0</p><button id="oBtn">Play Again</button></div></div>
  </div>
  <div class="hint">Arrows / WASD to turn &amp; thrust &middot; Space to shoot &middot; touch buttons appear on mobile</div>

<script src="sfx.js"></script>
<script>
(function () {
  const W = 560, H = 440;
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay'), oText = document.getElementById('oText');
  const muteBtn = document.getElementById('mute');
  const sfx = window.SFX || { blip(){}, hit(){}, explosion(){}, lose(){}, levelup(){}, toggleMute(){ return false; } };

  let ship, asteroids, bullets, particles, score, lives, running, wave;
  let best = 0;
  try { best = parseInt(localStorage.getItem('asteroidsBest') || '0', 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;
  const keys = {};

  function wrap(o) { if (o.x < 0) o.x += W; if (o.x > W) o.x -= W; if (o.y < 0) o.y += H; if (o.y > H) o.y -= H; }

  function makeAsteroid(x, y, size) {
    const a = Math.random() * Math.PI * 2, sp = (3 - size) * 0.5 + 0.5;
    const verts = [];
    const n = 8 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) verts.push(0.7 + Math.random() * 0.5);
    return { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size, r: size * 14, rot: 0, vr: (Math.random() - 0.5) * 0.04, verts };
  }

  function spawnWave(n) { asteroids = []; for (let i = 0; i < n; i++) asteroids.push(makeAsteroid(Math.random() * W, Math.random() < 0.5 ? 0 : H, 3)); }

  function reset(full) {
    if (full) { score = 0; lives = 3; wave = 1; scoreEl.textContent = '0'; livesEl.textContent = '3'; overlay.classList.remove('show'); running = true; }
    ship = { x: W/2, y: H/2, a: -Math.PI/2, vx: 0, vy: 0, r: 10, cooldown: 0, invuln: 90 };
    bullets = []; particles = [];
    spawnWave(3 + wave);
  }

  function boom(x, y, color, n) { for (let i = 0; i < (n||10); i++) { const a = Math.random()*Math.PI*2, s = 1+Math.random()*3; particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, color }); } }

  function shoot() {
    if (ship.cooldown > 0 || !running) return;
    bullets.push({ x: ship.x + Math.cos(ship.a)*ship.r, y: ship.y + Math.sin(ship.a)*ship.r, vx: Math.cos(ship.a)*7 + ship.vx, vy: Math.sin(ship.a)*7 + ship.vy, life: 60 });
    ship.cooldown = 12; sfx.blip(760);
  }

  function loop() { requestAnimationFrame(loop); if (running) update(); draw(); }

  function update() {
    if (keys.left) ship.a -= 0.07; if (keys.right) ship.a += 0.07;
    if (keys.up) { ship.vx += Math.cos(ship.a)*0.15; ship.vy += Math.sin(ship.a)*0.15; if (Math.random()<0.5) particles.push({ x: ship.x - Math.cos(ship.a)*ship.r, y: ship.y - Math.sin(ship.a)*ship.r, vx: -Math.cos(ship.a)*2, vy: -Math.sin(ship.a)*2, life: 0.5, color: '#fb923c' }); }
    ship.vx *= 0.99; ship.vy *= 0.99;
    ship.x += ship.vx; ship.y += ship.vy; wrap(ship);
    if (ship.cooldown > 0) ship.cooldown--;
    if (ship.invuln > 0) ship.invuln--;
    if (keys.shoot) shoot();

    for (const b of bullets) { b.x += b.vx; b.y += b.vy; b.life--; wrap(b); }
    bullets = bullets.filter(b => b.life > 0);

    for (const a of asteroids) { a.x += a.vx; a.y += a.vy; a.rot += a.vr; wrap(a); }

    // bullet vs asteroid
    for (const b of bullets) {
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        if (Math.hypot(b.x - a.x, b.y - a.y) < a.r) {
          b.life = 0; score += (4 - a.size) * 20; scoreEl.textContent = score;
          sfx.hit(); boom(a.x, a.y, '#a78bfa', 12);
          asteroids.splice(i, 1);
          if (a.size > 1) { asteroids.push(makeAsteroid(a.x, a.y, a.size - 1)); asteroids.push(makeAsteroid(a.x, a.y, a.size - 1)); }
          break;
        }
      }
    }

    // ship vs asteroid
    if (ship.invuln <= 0) {
      for (const a of asteroids) {
        if (Math.hypot(ship.x - a.x, ship.y - a.y) < a.r + ship.r) {
          lives--; livesEl.textContent = lives; sfx.explosion(); boom(ship.x, ship.y, '#6ee7f9', 20);
          if (lives <= 0) return end();
          ship.x = W/2; ship.y = H/2; ship.vx = ship.vy = 0; ship.invuln = 120;
          break;
        }
      }
    }

    if (asteroids.length === 0) { wave++; sfx.levelup(); reset(false); }

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life -= 0.03; }
    particles = particles.filter(p => p.life > 0);
  }

  function end() {
    running = false; sfx.lose();
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('asteroidsBest', String(best)); } catch (e) {} }
    oText.textContent = 'Score: ' + score;
    overlay.classList.add('show');
  }

  function draw() {
    ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    for (let i = 0; i < 30; i++) ctx.fillRect((i*89)%W, (i*61)%H, 2, 2);

    // asteroids
    ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 2;
    for (const a of asteroids) {
      ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot); ctx.beginPath();
      for (let i = 0; i < a.verts.length; i++) { const ang = (i / a.verts.length) * Math.PI * 2, rr = a.r * a.verts[i]; const x = Math.cos(ang)*rr, y = Math.sin(ang)*rr; if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
      ctx.closePath(); ctx.stroke(); ctx.restore();
    }

    // ship
    if (running && (ship.invuln <= 0 || Math.floor(ship.invuln/6)%2===0)) {
      ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
      ctx.strokeStyle = '#6ee7f9'; ctx.lineWidth = 2; ctx.shadowColor = '#6ee7f9'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-10, -9); ctx.lineTo(-5, 0); ctx.lineTo(-10, 9); ctx.closePath(); ctx.stroke();
      ctx.shadowBlur = 0; ctx.restore();
    }

    ctx.fillStyle = '#facc15'; for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, Math.PI*2); ctx.fill(); }
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); }
    ctx.globalAlpha = 1;
  }

  document.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (['arrowleft','a'].includes(k)) keys.left = true; if (['arrowright','d'].includes(k)) keys.right = true; if (['arrowup','w'].includes(k)) keys.up = true; if (k === ' ') { e.preventDefault(); keys.shoot = true; } if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault(); });
  document.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (['arrowleft','a'].includes(k)) keys.left = false; if (['arrowright','d'].includes(k)) keys.right = false; if (['arrowup','w'].includes(k)) keys.up = false; if (k === ' ') keys.shoot = false; });

  // simple touch: left half rotates, right half thrust, tap top shoots
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouch(e); }, { passive: false });
  canvas.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = keys.right = keys.up = keys.shoot = false; }, { passive: false });
  function handleTouch(e) {
    const r = canvas.getBoundingClientRect();
    for (const t of e.touches) {
      const x = (t.clientX - r.left) * (W / r.width), y = (t.clientY - r.top) * (H / r.height);
      if (y < H * 0.35) keys.shoot = true;
      else if (x < W / 2) keys.left = true;
      else keys.right = true;
      keys.up = y > H * 0.6;
    }
  }

  document.getElementById('oBtn').addEventListener('click', () => reset(true));
  muteBtn.addEventListener('click', () => { const m = sfx.toggleMute(); muteBtn.textContent = 'Sound: ' + (m ? 'Off' : 'On'); });

  reset(true);
  loop();
})();
</script>
</body>
</html>
