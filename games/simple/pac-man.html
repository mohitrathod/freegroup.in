<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; align-items: center; }
  .hud span b { color: #6ee7f9; }
  .wrap { position: relative; }
  canvas { background: #05070f; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 0 60px rgba(250,204,21,0.08); touch-action: none; max-width: 100%; display: block; }
  button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8; padding: 8px 18px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  button:hover { background: rgba(110,231,249,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; text-align: center; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(9,11,20,0.82); border-radius: 12px; }
  #overlay.show { display: flex; }
  #overlay .panel { text-align: center; padding: 24px 32px; }
  #overlay h2 { font-size: 1.8rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 16px; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Pac-Man</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
    <span>Lives: <b id="lives">3</b></span>
    <button id="mute">Sound: On</button>
  </div>
  <div class="wrap">
    <canvas id="game" width="448" height="496"></canvas>
    <div id="overlay"><div class="panel"><h2 id="oTitle">Game Over</h2><p id="oText">Score: 0</p><button id="oBtn">Play Again</button></div></div>
  </div>
  <div class="hint">Arrows / WASD to move &middot; eat all dots &middot; power pellets let you eat ghosts</div>

<script src="sfx.js"></script>
<script>
(function () {
  // 28 x 31 tile maze. 0=wall 1=dot 2=power 3=empty 4=ghost gate
  const MAP = [
    "1111111111111111111111111111",
    "1222222222221111222222222221",
    "1211112111121111211112111121",
    "1211112111121111211112111121",
    "1111111111111111111111111111",
    "1211112112111111112112111121",
    "1222221211111111111121222221",
    "1111112111133331113112111111",
    "3333312113300000031132133333",
    "1111112113044444403112111111",
    "3333312113000000003112133333",
    "1111112113000000003112111111",
    "3333312113000000003112133333",
    "1111112113344444433112111111",
    "3333312113333333333112133333",
    "1111112113111111111132111111",
    "1222222222221111222222222221",
    "1211112111121111211112111121",
    "1222112222233333222222112221",
    "1112112112111111112112112111",
    "1222222212211111112122222221",
    "1211111112211111112111111121",
    "1211111112211111112111111121",
    "1222222222222222222222222221",
    "1111111111111111111111111111"
  ];
  const ROWS = MAP.length, COLS = MAP[0].length, TILE = 16;
  const W = COLS * TILE, H = ROWS * TILE;
  const canvas = document.getElementById('game'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay'), oText = document.getElementById('oText'), oTitle = document.getElementById('oTitle');
  const muteBtn = document.getElementById('mute');
  const sfx = window.SFX || { pickup(){}, hit(){}, win(){}, lose(){}, blip(){}, toggleMute(){ return false; } };

  let grid, pac, ghosts, score, lives, dotsLeft, running, frightened, frightTimer, animT;
  let best = 0;
  try { best = parseInt(localStorage.getItem('pacmanBest') || '0', 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;

  function buildGrid() {
    grid = []; dotsLeft = 0;
    for (let r = 0; r < ROWS; r++) {
      grid[r] = [];
      for (let c = 0; c < COLS; c++) {
        const ch = MAP[r][c];
        grid[r][c] = parseInt(ch, 10);
        if (grid[r][c] === 1 || grid[r][c] === 2) dotsLeft++;
      }
    }
  }

  function isWall(c, r) { if (r < 0 || r >= ROWS) return true; c = (c + COLS) % COLS; return grid[r][c] === 0; }

  function reset(full) {
    if (full) { score = 0; lives = 3; scoreEl.textContent = '0'; livesEl.textContent = '3'; overlay.classList.remove('show'); }
    buildGrid();
    pac = { c: 13.5, r: 23, dir: { x: 0, y: 0 }, want: { x: 0, y: 0 }, speed: 0.11, mouth: 0 };
    ghosts = [
      { c: 13.5, r: 11, color: '#f87171', dir: { x: 1, y: 0 }, home: { c: 26, r: 1 } },
      { c: 12.5, r: 12, color: '#f9a8d4', dir: { x: -1, y: 0 }, home: { c: 1, r: 1 } },
      { c: 14.5, r: 12, color: '#67e8f9', dir: { x: 1, y: 0 }, home: { c: 26, r: 23 } },
      { c: 15.5, r: 12, color: '#fdba74', dir: { x: -1, y: 0 }, home: { c: 1, r: 23 } }
    ];
    for (const g of ghosts) { g.speed = 0.085; g.startC = g.c; g.startR = g.r; }
    frightened = false; frightTimer = 0; animT = 0; running = true;
  }

  function aligned(v) { return Math.abs(v - Math.round(v)) < 0.08; }

  function tryMove(ent, dir) {
    const nc = Math.round(ent.c) + dir.x, nr = Math.round(ent.r) + dir.y;
    return !isWall(nc, nr);
  }

  function moveEnt(ent) {
    ent.c += ent.dir.x * ent.speed;
    ent.r += ent.dir.y * ent.speed;
    if (ent.c < -0.5) ent.c = COLS - 0.5;
    if (ent.c > COLS - 0.5) ent.c = -0.5;
  }

  function updatePac() {
    if (aligned(pac.c) && aligned(pac.r)) {
      pac.c = Math.round(pac.c); pac.r = Math.round(pac.r);
      if ((pac.want.x || pac.want.y) && tryMove(pac, pac.want)) pac.dir = { ...pac.want };
      if (!tryMove(pac, pac.dir)) pac.dir = { x: 0, y: 0 };
      // eat
      const cell = grid[pac.r] && grid[pac.r][pac.c];
      if (cell === 1) { grid[pac.r][pac.c] = 3; score += 10; dotsLeft--; scoreEl.textContent = score; sfx.pickup(); }
      else if (cell === 2) { grid[pac.r][pac.c] = 3; score += 50; dotsLeft--; scoreEl.textContent = score; frightened = true; frightTimer = 360; sfx.blip(300); }
    }
    moveEnt(pac);
    pac.mouth = (pac.mouth + 0.18) % (Math.PI * 0.9);
  }

  function updateGhost(g) {
    if (aligned(g.c) && aligned(g.r)) {
      g.c = Math.round(g.c); g.r = Math.round(g.r);
      const opts = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
      const target = frightened ? { c: g.home.c, r: g.home.r } : { c: Math.round(pac.c), r: Math.round(pac.r) };
      let candidates = opts.filter(d => tryMove(g, d) && !(d.x === -g.dir.x && d.y === -g.dir.y));
      if (candidates.length === 0) candidates = opts.filter(d => tryMove(g, d));
      if (candidates.length) {
        if (frightened) { candidates.sort((a, b) => dist(g, a, target) - dist(g, b, target)); g.dir = candidates[candidates.length - 1]; if (Math.random() < 0.4) g.dir = candidates[Math.floor(Math.random()*candidates.length)]; }
        else { candidates.sort((a, b) => dist(g, a, target) - dist(g, b, target)); g.dir = candidates[0]; }
      }
    }
    moveEnt(g);
  }

  function dist(g, d, t) { const c = Math.round(g.c) + d.x, r = Math.round(g.r) + d.y; return Math.hypot(c - t.c, r - t.r); }

  function checkGhostCollisions() {
    for (const g of ghosts) {
      if (Math.abs(g.c - pac.c) < 0.6 && Math.abs(g.r - pac.r) < 0.6) {
        if (frightened) { score += 200; scoreEl.textContent = score; sfx.hit(); g.c = g.startC; g.r = g.startR; }
        else { lives--; livesEl.textContent = lives; sfx.lose(); if (lives <= 0) return end(false); softReset(); return; }
      }
    }
  }

  function softReset() {
    pac.c = 13.5; pac.r = 23; pac.dir = { x: 0, y: 0 }; pac.want = { x: 0, y: 0 };
    for (const g of ghosts) { g.c = g.startC; g.r = g.startR; }
    frightened = false; frightTimer = 0;
  }

  function end(won) {
    running = false;
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('pacmanBest', String(best)); } catch (e) {} }
    oTitle.textContent = won ? 'You Win!' : 'Game Over';
    oText.textContent = 'Score: ' + score;
    overlay.classList.add('show');
    if (won) sfx.win(); else sfx.lose();
  }

  function loop() { requestAnimationFrame(loop); if (running) update(); draw(); }

  function update() {
    animT++;
    updatePac();
    for (const g of ghosts) updateGhost(g);
    checkGhostCollisions();
    if (frightened) { frightTimer--; if (frightTimer <= 0) frightened = false; }
    if (dotsLeft <= 0) end(true);
  }

  function draw() {
    ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, W, H);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const cell = grid[r][c], x = c * TILE, y = r * TILE;
      if (cell === 0) { ctx.fillStyle = '#1e2a52'; ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2); ctx.strokeStyle = '#3b4fa0'; ctx.lineWidth = 1; ctx.strokeRect(x + 1.5, y + 1.5, TILE - 3, TILE - 3); }
      else if (cell === 1) { ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(x + TILE/2, y + TILE/2, 2, 0, Math.PI*2); ctx.fill(); }
      else if (cell === 2) { ctx.fillStyle = '#fde68a'; ctx.beginPath(); ctx.arc(x + TILE/2, y + TILE/2, 5 + Math.sin(animT*0.2)*1, 0, Math.PI*2); ctx.fill(); }
    }
    // pac
    const px = pac.c * TILE + TILE/2, py = pac.r * TILE + TILE/2;
    let ang = 0; if (pac.dir.x === 1) ang = 0; else if (pac.dir.x === -1) ang = Math.PI; else if (pac.dir.y === 1) ang = Math.PI/2; else if (pac.dir.y === -1) ang = -Math.PI/2;
    ctx.save(); ctx.translate(px, py); ctx.rotate(ang);
    ctx.fillStyle = '#facc15'; ctx.shadowColor = '#facc15'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, TILE/2 - 1, pac.mouth, Math.PI*2 - pac.mouth); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.restore();
    // ghosts
    for (const g of ghosts) {
      const gx = g.c * TILE + TILE/2, gy = g.r * TILE + TILE/2, rr = TILE/2 - 1;
      ctx.fillStyle = frightened ? (frightTimer < 120 && Math.floor(frightTimer/10)%2 ? '#e8ecf8' : '#3b82f6') : g.color;
      ctx.beginPath(); ctx.arc(gx, gy - 1, rr, Math.PI, 0); ctx.lineTo(gx + rr, gy + rr); ctx.lineTo(gx + rr/2, gy + rr*0.6); ctx.lineTo(gx, gy + rr); ctx.lineTo(gx - rr/2, gy + rr*0.6); ctx.lineTo(gx - rr, gy + rr); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(gx - 3, gy - 2, 2.5, 0, Math.PI*2); ctx.arc(gx + 3, gy - 2, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0a0e1a'; ctx.beginPath(); ctx.arc(gx - 3 + g.dir.x, gy - 2 + g.dir.y, 1.2, 0, Math.PI*2); ctx.arc(gx + 3 + g.dir.x, gy - 2 + g.dir.y, 1.2, 0, Math.PI*2); ctx.fill();
    }
  }

  function setWant(x, y) { pac.want = { x, y }; }
  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowleft','a'].includes(k)) { setWant(-1, 0); e.preventDefault(); }
    else if (['arrowright','d'].includes(k)) { setWant(1, 0); e.preventDefault(); }
    else if (['arrowup','w'].includes(k)) { setWant(0, -1); e.preventDefault(); }
    else if (['arrowdown','s'].includes(k)) { setWant(0, 1); e.preventDefault(); }
  });
  // touch swipe
  let ts = null;
  canvas.addEventListener('touchstart', (e) => { ts = { x: e.touches[0].clientX, y: e.touches[0].clientY }; e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    if (!ts) return; const dx = e.changedTouches[0].clientX - ts.x, dy = e.changedTouches[0].clientY - ts.y;
    if (Math.abs(dx) > Math.abs(dy)) setWant(dx > 0 ? 1 : -1, 0); else setWant(0, dy > 0 ? 1 : -1);
    ts = null; e.preventDefault();
  }, { passive: false });

  document.getElementById('oBtn').addEventListener('click', () => reset(true));
  muteBtn.addEventListener('click', () => { const m = sfx.toggleMute(); muteBtn.textContent = 'Sound: ' + (m ? 'Off' : 'On'); });

  reset(true);
  loop();
})();
</script>
</body>
</html>
