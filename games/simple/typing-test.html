<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Test — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 26px; font-size: 1rem; }
  .hud span b { color: #6ee7f9; font-variant-numeric: tabular-nums; }
  .quote {
    max-width: 640px; font-size: 1.35rem; line-height: 1.9; letter-spacing: 0.02em;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 22px 26px;
  }
  .quote .ch { transition: color 0.05s; }
  .quote .correct { color: #4ade80; }
  .quote .wrong { color: #f87171; background: rgba(248,113,113,0.15); border-radius: 3px; }
  .quote .pending { color: #6b7391; }
  .quote .cursor { border-left: 2px solid #6ee7f9; margin-left: -2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { border-color: transparent; } }
  input { position: absolute; opacity: 0; pointer-events: none; }
  button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8; padding: 9px 22px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; }
  button:hover { background: rgba(110,231,249,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Typing Test</h1>
  <div class="hud">
    <span>WPM: <b id="wpm">0</b></span>
    <span>Accuracy: <b id="acc">100</b>%</span>
    <span>Time: <b id="time">0</b>s</span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <div class="quote" id="quote" tabindex="0"></div>
  <input id="hidden" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <button id="restart">New Text</button>
  <div class="hint">Just start typing. Timer begins on your first keystroke.</div>

<script src="sfx.js"></script>
<script>
(function () {
  const QUOTES = [
    'The quick brown fox jumps over the lazy dog while the sun sets behind the hills.',
    'Programming is the art of telling another human what one wants the computer to do.',
    'A journey of a thousand miles begins with a single step taken in the right direction.',
    'Simplicity is the ultimate sophistication when it comes to writing clean and readable code.',
    'The best way to predict the future is to invent it with your own two hands today.',
    'Success is not final, failure is not fatal, it is the courage to continue that counts.'
  ];
  const quoteEl = document.getElementById('quote'), hidden = document.getElementById('hidden');
  const wpmEl = document.getElementById('wpm'), accEl = document.getElementById('acc'), timeEl = document.getElementById('time'), bestEl = document.getElementById('best');
  const sfx = window.SFX || { blip(){}, hit(){}, win(){} };
  let text, typed, startTime, timerId, done;
  let best = 0;
  try { best = parseInt(localStorage.getItem('typingBest') || '0', 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;

  function reset() {
    text = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    typed = ''; startTime = null; done = false;
    clearInterval(timerId);
    wpmEl.textContent = '0'; accEl.textContent = '100'; timeEl.textContent = '0';
    render();
    hidden.value = ''; hidden.focus();
  }

  function render() {
    let html = '';
    for (let i = 0; i < text.length; i++) {
      let cls = 'pending';
      if (i < typed.length) cls = typed[i] === text[i] ? 'correct' : 'wrong';
      const cursor = i === typed.length ? ' cursor' : '';
      const ch = text[i] === ' ' ? '&nbsp;' : text[i];
      html += '<span class="ch ' + cls + cursor + '">' + ch + '</span>';
    }
    quoteEl.innerHTML = html;
  }

  function update() {
    if (!startTime) return;
    const secs = (Date.now() - startTime) / 1000;
    timeEl.textContent = secs.toFixed(0);
    const words = typed.length / 5;
    wpmEl.textContent = secs > 0 ? Math.round(words / (secs / 60)) : 0;
    let correct = 0;
    for (let i = 0; i < typed.length; i++) if (typed[i] === text[i]) correct++;
    accEl.textContent = typed.length ? Math.round(correct / typed.length * 100) : 100;
  }

  function onInput() {
    if (done) return;
    if (!startTime) { startTime = Date.now(); timerId = setInterval(update, 200); }
    const prev = typed.length;
    typed = hidden.value.slice(0, text.length);
    if (typed.length > prev) { const i = typed.length - 1; if (typed[i] === text[i]) sfx.blip(600); else sfx.hit(); }
    render(); update();
    if (typed.length >= text.length) finish();
  }

  function finish() {
    done = true; clearInterval(timerId); update();
    const wpm = parseInt(wpmEl.textContent, 10);
    if (wpm > best) { best = wpm; bestEl.textContent = best; try { localStorage.setItem('typingBest', String(best)); } catch (e) {} sfx.win(); }
    quoteEl.innerHTML += '<div style="margin-top:14px;color:#4ade80;font-size:1rem">Done! ' + wpm + ' WPM at ' + accEl.textContent + '% accuracy.</div>';
  }

  hidden.addEventListener('input', onInput);
  quoteEl.addEventListener('click', () => hidden.focus());
  document.getElementById('restart').addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
