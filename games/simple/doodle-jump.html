<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodle Jump — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; align-items: center; }
  .hud span b { color: #6ee7f9; }
  .wrap { position: relative; }
  canvas { background: linear-gradient(180deg, #101a33, #0a0e1a); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 0 60px rgba(74,222,128,0.08); touch-action: none; max-width: 100%; display: block; }
  button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8; padding: 8px 18px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  button:hover { background: rgba(110,231,249,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(9,11,20,0.82); border-radius: 12px; }
  #overlay.show { display: flex; }
  #overlay .panel { text-align: center; padding: 24px 32px; }
  #overlay h2 { font-size: 1.8rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 16px; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Doodle Jump</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
    <button id="mute">Sound: On</button>
  </div>
  <div class="wrap">
    <canvas id="game" width="360" height="520"></canvas>
    <div id="overlay"><div class="panel"><h2>You Fell!</h2><p id="oText">Score: 0</p><button id="oBtn">Play Again</button></div></div>
  </div>
  <div class="hint">Left / right arrows or A-D &middot; tilt-free: drag on touch &middot; keep jumping up</div>

<script src="sfx.js"></script>
<script>
(function () {
  const W = 360, H = 520;
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay'), oText = document.getElementById('oText');
  const muteBtn = document.getElementById('mute');
  const sfx = window.SFX || { blip(){}, drop(){}, lose(){}, toggleMute(){ return false; } };

  const GRAV = 0.28, JUMP = -11, PLAT_W = 62, PLAT_H = 12;
  let player, platforms, score, running, cameraY, keys = { l: false, r: false }, touchX = null;
  let best = 0;
  try { best = parseInt(localStorage.getItem('doodleBest') || '0', 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;

  function makePlatform(y, moving) {
    return { x: Math.random() * (W - PLAT_W), y, moving: !!moving, vx: moving ? (Math.random() < 0.5 ? 1.4 : -1.4) : 0 };
  }

  function reset() {
    platforms = [];
    platforms.push({ x: W/2 - PLAT_W/2, y: H - 40, moving: false, vx: 0 });
    for (let i = 1; i < 9; i++) platforms.push(makePlatform(H - 40 - i * 62, i > 4 && Math.random() < 0.35));
    player = { x: W/2, y: H - 70, vy: JUMP, r: 16, dir: 1 };
    score = 0; cameraY = 0; running = true;
    scoreEl.textContent = '0'; overlay.classList.remove('show');
  }

  function loop() { requestAnimationFrame(loop); if (running) update(); draw(); }

  function update() {
    if (keys.l) { player.x -= 5.5; player.dir = -1; }
    if (keys.r) { player.x += 5.5; player.dir = 1; }
    if (touchX !== null) { const d = touchX - player.x; player.x += Math.max(-6, Math.min(6, d * 0.3)); player.dir = d < 0 ? -1 : 1; }
    if (player.x < -player.r) player.x = W + player.r;
    if (player.x > W + player.r) player.x = -player.r;

    player.vy += GRAV;
    player.y += player.vy;

    // camera scroll: keep player around 40% from top
    if (player.y < H * 0.4) {
      const dy = H * 0.4 - player.y;
      player.y = H * 0.4;
      cameraY += dy;
      score += Math.floor(dy);
      scoreEl.textContent = score;
      for (const p of platforms) p.y += dy;
    }

    // moving platforms
    for (const p of platforms) { if (p.moving) { p.x += p.vx; if (p.x < 0 || p.x > W - PLAT_W) p.vx *= -1; } }

    // land on platform (only when falling)
    if (player.vy > 0) {
      for (const p of platforms) {
        if (player.x + player.r > p.x && player.x - player.r < p.x + PLAT_W &&
            player.y + player.r > p.y && player.y + player.r < p.y + PLAT_H + player.vy) {
          player.vy = JUMP; sfx.blip(520);
        }
      }
    }

    // recycle platforms that fell below
    platforms = platforms.filter(p => p.y < H + 20);
    while (platforms.length < 9) {
      const highest = platforms.reduce((m, p) => Math.min(m, p.y), H);
      platforms.push(makePlatform(highest - 62 - Math.random() * 24, Math.random() < 0.3 + Math.min(0.3, score / 20000)));
    }

    if (player.y - player.r > H) end();
  }

  function end() {
    running = false; sfx.lose();
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('doodleBest', String(best)); } catch (e) {} }
    oText.textContent = 'Score: ' + score;
    overlay.classList.add('show');
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let i = 0; i < 25; i++) ctx.fillRect((i*71)%W, ((i*97 + cameraY*0.3)%H), 2, 2);

    for (const p of platforms) {
      ctx.fillStyle = p.moving ? '#f472b6' : '#4ade80';
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.roundRect(p.x, p.y, PLAT_W, PLAT_H, 6); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // player
    ctx.save(); ctx.translate(player.x, player.y);
    ctx.fillStyle = '#6ee7f9'; ctx.shadowColor = '#6ee7f9'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0a0e1a';
    ctx.beginPath(); ctx.arc(player.dir * 5, -3, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(player.dir * 5 + player.dir * 7, -3, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  document.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (['arrowleft','a'].includes(k)) { keys.l = true; e.preventDefault(); } if (['arrowright','d'].includes(k)) { keys.r = true; e.preventDefault(); } });
  document.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (['arrowleft','a'].includes(k)) keys.l = false; if (['arrowright','d'].includes(k)) keys.r = false; });
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const r = canvas.getBoundingClientRect(); touchX = (e.touches[0].clientX - r.left) * (W / r.width); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); const r = canvas.getBoundingClientRect(); touchX = (e.touches[0].clientX - r.left) * (W / r.width); }, { passive: false });
  canvas.addEventListener('touchend', () => { touchX = null; });

  document.getElementById('oBtn').addEventListener('click', reset);
  muteBtn.addEventListener('click', () => { const m = sfx.toggleMute(); muteBtn.textContent = 'Sound: ' + (m ? 'Off' : 'On'); });

  reset();
  loop();
})();
</script>
</body>
</html>
