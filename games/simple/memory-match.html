<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; }
  .hud span b { color: #6ee7f9; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(70px, 110px));
    gap: 10px;
    justify-content: center;
  }
  .card {
    aspect-ratio: 1;
    background: linear-gradient(145deg, #1e2747, #141a30);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    user-select: none;
    transform-style: preserve-3d;
    transition: transform 0.3s ease, background 0.15s;
  }
  .card.flipped { transform: rotateY(180deg); background: #0d1120; }
  .card.matched { background: rgba(74,222,128,0.14); border-color: #4ade80; cursor: default; }
  .card .back { display: block; }
  .card .front { display: none; }
  .card.flipped .back { display: none; }
  .card.flipped .front { display: block; }
  .card:hover:not(.flipped):not(.matched) { border-color: rgba(110,231,249,0.5); }
  button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: #e8ecf8;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { background: rgba(110,231,249,0.15); }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(9,11,20,0.85); z-index: 10; }
  #overlay.show { display: flex; }
  #overlay .panel { text-align: center; padding: 28px 36px; }
  #overlay h2 { font-size: 2rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 18px; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Memory Match</h1>
  <div class="hud">
    <span>Moves: <b id="moves">0</b></span>
    <span>Time: <b id="time">0:00</b></span>
    <span>Best: <b id="best">--</b></span>
  </div>
  <div class="board" id="board"></div>
  <button id="restart">Restart</button>

  <div id="overlay">
    <div class="panel">
      <h2>You Win!</h2>
      <p id="winText">Cleared in 0 moves.</p>
      <button id="playAgain">Play Again</button>
    </div>
  </div>

<script>
(function () {
  const boardEl = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const winText = document.getElementById('winText');

  const SYMBOLS = ['\u2660','\u2665','\u2666','\u2663','\u2605','\u263A','\u269B','\u273A'];
  let best = null;
  try { const v = localStorage.getItem('memoryBest'); if (v) best = parseInt(v, 10); } catch (e) { /* ignore */ }
  bestEl.textContent = best === null ? '--' : best + ' moves';

  let cards, flipped, locked, moves, matched, seconds, timerId;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function start() {
    cards = shuffle(SYMBOLS.concat(SYMBOLS)).map((sym, i) => ({ id: i, sym, matched: false }));
    flipped = [];
    locked = false;
    moves = 0;
    matched = 0;
    seconds = 0;
    movesEl.textContent = '0';
    timeEl.textContent = '0:00';
    overlay.classList.remove('show');
    clearInterval(timerId);
    timerId = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      timeEl.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    }, 1000);
    render();
  }

  function render() {
    boardEl.innerHTML = '';
    cards.forEach((card, i) => {
      const el = document.createElement('div');
      el.className = 'card' + (card.matched ? ' matched' : '');
      el.dataset.index = i;
      el.innerHTML = '<span class="front">' + card.sym + '</span><span class="back">?</span>';
      el.addEventListener('click', () => flip(i));
      boardEl.appendChild(el);
    });
  }

  function flip(i) {
    if (locked || flipped.length >= 2 || cards[i].matched) return;
    const idx = flipped.findIndex(f => f === i);
    if (idx >= 0) return;
    const el = boardEl.children[i];
    el.classList.add('flipped');
    flipped.push(i);
    if (flipped.length === 2) {
      moves++;
      movesEl.textContent = moves;
      setTimeout(resolve, 650);
    }
  }

  function resolve() {
    locked = true;
    const [a, b] = flipped;
    if (cards[a].sym === cards[b].sym) {
      cards[a].matched = true;
      cards[b].matched = true;
      boardEl.children[a].classList.add('matched');
      boardEl.children[b].classList.add('matched');
      matched += 2;
      flipped = [];
      locked = false;
      if (matched === cards.length) finish();
    } else {
      setTimeout(() => {
        boardEl.children[a].classList.remove('flipped');
        boardEl.children[b].classList.remove('flipped');
        flipped = [];
        locked = false;
      }, 450);
    }
  }

  function finish() {
    clearInterval(timerId);
    if (best === null || moves < best) {
      best = moves;
      bestEl.textContent = best + ' moves';
      try { localStorage.setItem('memoryBest', String(best)); } catch (e) { /* ignore */ }
    }
    winText.textContent = 'Cleared in ' + moves + ' moves (' + timeEl.textContent + ').';
    overlay.classList.add('show');
  }

  document.getElementById('restart').addEventListener('click', start);
  document.getElementById('playAgain').addEventListener('click', start);

  start();
})();
</script>
</body>
</html>
