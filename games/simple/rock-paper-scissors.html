<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .scores { display: flex; gap: 26px; font-size: 1rem; }
  .scores span b { color: #6ee7f9; }
  .arena {
    display: flex;
    gap: 30px;
    align-items: center;
    justify-content: center;
    min-height: 130px;
  }
  .side { text-align: center; }
  .side .label { color: #9aa3bf; font-size: 0.85rem; margin-bottom: 6px; }
  .choice {
    width: 110px;
    height: 110px;
    border-radius: 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.4rem;
  }
  .choice.win { border-color: #4ade80; box-shadow: 0 0 30px rgba(74,222,128,0.35); }
  .choice.lose { border-color: #f87171; box-shadow: 0 0 30px rgba(248,113,113,0.25); }
  .vs { font-size: 1.4rem; color: #9aa3bf; font-weight: 700; }
  .status { font-size: 1.1rem; min-height: 1.5em; }
  .status b.win { color: #4ade80; }
  .status b.lose { color: #f87171; }
  .status b.draw { color: #facc15; }
  .buttons { display: flex; gap: 12px; }
  button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: #e8ecf8;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  button:hover { background: rgba(110,231,249,0.18); border-color: #6ee7f9; }
  button:disabled { opacity: 0.5; cursor: default; }
  .history { color: #9aa3bf; font-size: 0.82rem; max-width: 520px; text-align: center; min-height: 1.2em; }
  .reset { font-size: 0.85rem; padding: 6px 14px; background: transparent; border-color: rgba(255,255,255,0.1); }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Rock Paper Scissors</h1>
  <div class="scores">
    <span>You: <b id="playerScore">0</b></span>
    <span>Computer: <b id="compScore">0</b></span>
    <span>Draws: <b id="drawScore">0</b></span>
  </div>
  <div class="arena">
    <div class="side">
      <div class="label">You</div>
      <div class="choice" id="playerChoice">?</div>
    </div>
    <div class="vs">VS</div>
    <div class="side">
      <div class="label">Computer</div>
      <div class="choice" id="compChoice">?</div>
    </div>
  </div>
  <div class="status" id="status">Pick your move!</div>
  <div class="buttons">
    <button data-move="rock">&#9994;</button>
    <button data-move="paper">&#9995;</button>
    <button data-move="scissors">&#9996;</button>
  </div>
  <div class="history" id="history"></div>
  <button class="reset" id="reset">Reset scores</button>

<script>
(function () {
  const EMOJI = { rock: '\u270A', paper: '\u270B', scissors: '\u270C' };
  const BEATS = { rock: 'scissors', scissors: 'paper', paper: 'rock' };
  const playerChoiceEl = document.getElementById('playerChoice');
  const compChoiceEl = document.getElementById('compChoice');
  const statusEl = document.getElementById('status');
  const historyEl = document.getElementById('history');

  let tally = { p: 0, c: 0, d: 0 };
  try {
    const t = JSON.parse(localStorage.getItem('rpsTally') || 'null');
    if (t) tally = t;
  } catch (e) { /* ignore */ }
  updateScores();

  let history = [];
  let playerHistory = [];
  let busy = false;

  // BEATS[x] = what x beats; to counter x we need y where BEATS[y] === x
  function counter(move) {
    for (const m of ['rock', 'paper', 'scissors']) if (BEATS[m] === move) return m;
    return 'rock';
  }

  function play(player) {
    if (busy) return;
    busy = true;
    // Computer strategy: counter the player's most frequent recent move (70% of the time).
    let cmove;
    if (playerHistory.length < 3) {
      cmove = ['rock', 'paper', 'scissors'][Math.floor(Math.random() * 3)];
    } else {
      const counts = { rock: 0, paper: 0, scissors: 0 };
      for (const m of playerHistory.slice(-5)) counts[m]++;
      const mostCommon = Object.keys(counts).reduce((a, b) => (counts[b] > counts[a] ? b : a));
      cmove = Math.random() < 0.7 ? counter(mostCommon) : ['rock', 'paper', 'scissors'][Math.floor(Math.random() * 3)];
    }

    playerChoiceEl.textContent = EMOJI[player];
    compChoiceEl.textContent = '?';
    playerChoiceEl.classList.remove('win', 'lose');
    compChoiceEl.classList.remove('win', 'lose');

    setTimeout(() => {
      compChoiceEl.textContent = EMOJI[cmove];
      let result;
      if (player === cmove) result = 'draw';
      else if (BEATS[player] === cmove) result = 'win';
      else result = 'lose';

      playerHistory.push(player);

      if (result === 'win') {
        tally.p++;
        playerChoiceEl.classList.add('win');
        compChoiceEl.classList.add('lose');
        statusEl.innerHTML = 'You win! <b class="win">' + player + ' beats ' + cmove + '</b>';
      } else if (result === 'lose') {
        tally.c++;
        playerChoiceEl.classList.add('lose');
        compChoiceEl.classList.add('win');
        statusEl.innerHTML = 'Computer wins! <b class="lose">' + cmove + ' beats ' + player + '</b>';
      } else {
        tally.d++;
        playerChoiceEl.classList.add('win');
        compChoiceEl.classList.add('win');
        statusEl.innerHTML = 'Draw! <b class="draw">Both chose ' + player + '</b>';
      }
      updateScores();
      try { localStorage.setItem('rpsTally', JSON.stringify(tally)); } catch (e) { /* ignore */ }

      history.unshift((result === 'win' ? 'W' : result === 'lose' ? 'L' : 'D') + ' ' + player + ' vs ' + cmove);
      if (history.length > 12) history.pop();
      historyEl.textContent = 'Recent: ' + history.join('  |  ');

      busy = false;
    }, 450);
  }

  function updateScores() {
    document.getElementById('playerScore').textContent = tally.p;
    document.getElementById('compScore').textContent = tally.c;
    document.getElementById('drawScore').textContent = tally.d;
  }

  document.querySelectorAll('.buttons button').forEach(btn => {
    btn.addEventListener('click', () => play(btn.dataset.move));
  });
  document.getElementById('reset').addEventListener('click', () => {
    tally = { p: 0, c: 0, d: 0 };
    playerHistory = [];
    history = [];
    updateScores();
    historyEl.textContent = '';
    try { localStorage.setItem('rpsTally', JSON.stringify(tally)); } catch (e) { /* ignore */ }
  });

  // keyboard shortcuts 1/2/3
  document.addEventListener('keydown', (e) => {
    if (e.key === '1') play('rock');
    if (e.key === '2') play('paper');
    if (e.key === '3') play('scissors');
  });
})();
</script>
</body>
</html>
