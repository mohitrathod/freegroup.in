<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 24px; font-size: 1rem; align-items: center; }
  .hud span b { color: #6ee7f9; }
  .grid { display: grid; grid-template-columns: repeat(3, 100px); gap: 16px; }
  .hole {
    width: 100px; height: 100px; border-radius: 50%;
    background: radial-gradient(circle at 50% 80%, #0a0e1a 55%, #1a2240 100%);
    border: 2px solid rgba(255,255,255,0.08);
    position: relative; overflow: hidden; cursor: pointer;
  }
  .mole {
    position: absolute; left: 12%; bottom: -100%; width: 76%; height: 76%;
    border-radius: 46% 46% 40% 40%;
    background: radial-gradient(circle at 40% 30%, #a78bfa, #6d28d9);
    transition: bottom 0.12s ease-out;
    display: flex; align-items: center; justify-content: center;
  }
  .hole.up .mole { bottom: 8%; }
  .hole.bonk .mole { background: radial-gradient(circle at 40% 30%, #4ade80, #15803d); }
  .mole::before, .mole::after { content: ''; position: absolute; top: 30%; width: 10px; height: 10px; background: #0a0e1a; border-radius: 50%; }
  .mole::before { left: 26%; } .mole::after { right: 26%; }
  button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8; padding: 10px 24px; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  button:hover { background: rgba(110,231,249,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Whack-a-Mole</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Time: <b id="time">30</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <div class="grid" id="grid"></div>
  <button id="start">Start Game</button>
  <div class="hint">Whack the moles before they hide. 30 seconds!</div>

<script src="sfx.js"></script>
<script>
(function () {
  const gridEl = document.getElementById('grid');
  const scoreEl = document.getElementById('score'), timeEl = document.getElementById('time'), bestEl = document.getElementById('best');
  const startBtn = document.getElementById('start');
  const sfx = window.SFX || { hit(){}, blip(){}, win(){} };
  const HOLES = 9;
  let holes = [], score, timeLeft, playing = false, spawnTimer = null, countdown = null, best = 0;
  try { best = parseInt(localStorage.getItem('moleBest') || '0', 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;

  for (let i = 0; i < HOLES; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    hole.innerHTML = '<div class="mole"></div>';
    hole.addEventListener('click', () => whack(i));
    gridEl.appendChild(hole);
    holes.push({ el: hole, up: false });
  }

  function whack(i) {
    if (!playing || !holes[i].up) return;
    holes[i].up = false;
    holes[i].el.classList.remove('up');
    holes[i].el.classList.add('bonk');
    setTimeout(() => holes[i].el.classList.remove('bonk'), 150);
    score++; scoreEl.textContent = score; sfx.hit();
  }

  function popRandom() {
    const down = holes.filter(h => !h.up);
    if (!down.length) return;
    const h = down[Math.floor(Math.random() * down.length)];
    h.up = true; h.el.classList.add('up');
    const upTime = 600 + Math.random() * 700;
    setTimeout(() => { if (h.up) { h.up = false; h.el.classList.remove('up'); } }, upTime);
  }

  function start() {
    if (playing) return;
    playing = true; score = 0; timeLeft = 30;
    scoreEl.textContent = '0'; timeEl.textContent = '30';
    startBtn.textContent = 'Playing...'; startBtn.disabled = true;
    spawnTimer = setInterval(popRandom, 700);
    countdown = setInterval(() => {
      timeLeft--; timeEl.textContent = timeLeft;
      if (timeLeft <= 0) end();
    }, 1000);
  }

  function end() {
    playing = false;
    clearInterval(spawnTimer); clearInterval(countdown);
    holes.forEach(h => { h.up = false; h.el.classList.remove('up'); });
    startBtn.textContent = 'Play Again'; startBtn.disabled = false;
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('moleBest', String(best)); } catch (e) {} sfx.win(); }
  }

  startBtn.addEventListener('click', start);
})();
</script>
</body>
</html>
