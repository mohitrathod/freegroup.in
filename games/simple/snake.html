<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 24px; font-size: 1rem; align-items: center; }
  .hud span b { color: #6ee7f9; }
  .wrap { position: relative; }
  canvas {
    background: #0a0e1a;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(110, 231, 249, 0.10);
    touch-action: none;
    max-width: 100%;
    display: block;
  }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: #e8ecf8;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: rgba(110,231,249,0.15); }
  button:active { transform: scale(0.96); }
  .hint { color: #9aa3bf; font-size: 0.8rem; text-align: center; }
  #overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(9, 11, 20, 0.82); z-index: 10; border-radius: 12px;
  }
  #overlay.show { display: flex; animation: fade 0.25s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  #overlay .panel { text-align: center; padding: 28px 36px; }
  #overlay h2 { font-size: 2rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 18px; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Snake</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
    <button id="mute" title="Toggle sound">Sound: On</button>
  </div>
  <div class="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay">
      <div class="panel">
        <h2 id="overlayTitle">Game Over</h2>
        <p id="overlayText">Final score: 0</p>
        <button id="overlayBtn">Play Again</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="restart">Restart</button>
    <button id="pause">Pause</button>
  </div>
  <div class="hint">Arrow keys / WASD to move &middot; P to pause &middot; swipe on touch</div>

<script src="sfx.js"></script>
<script>
(function () {
  const SIZE = 20;
  const CELL = 400 / SIZE;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');
  const muteBtn = document.getElementById('mute');
  const sfx = window.SFX || { pickup(){}, lose(){}, toggleMute(){ return false; } };

  let best = 0;
  try { best = parseInt(localStorage.getItem('snakeBest') || '0', 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;

  let snake, dir, nextDir, food, score, alive, paused, gameOver;
  let particles = [];
  let acc = 0, stepMs = 130, last = 0, rafId = null;
  let foodPulse = 0;

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    alive = true;
    gameOver = false;
    paused = false;
    particles = [];
    stepMs = 130;
    acc = 0;
    last = performance.now();
    overlay.classList.remove('show');
    scoreEl.textContent = '0';
    document.getElementById('pause').textContent = 'Pause';
    spawnFood();
    if (!rafId) rafId = requestAnimationFrame(loop);
  }

  function spawnFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * SIZE), y: Math.floor(Math.random() * SIZE) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function burst(cx, cy, color) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color });
    }
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0) head.x = SIZE - 1;
    if (head.x >= SIZE) head.x = 0;
    if (head.y < 0) head.y = SIZE - 1;
    if (head.y >= SIZE) head.y = 0;

    if (snake.some(s => s.x === head.x && s.y === head.y)) { endGame(); return; }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      sfx.pickup();
      burst(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, '#f472b6');
      stepMs = Math.max(65, 130 - Math.floor(score / 50) * 6);
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function endGame() {
    alive = false;
    gameOver = true;
    sfx.lose();
    burst(snake[0].x * CELL + CELL / 2, snake[0].y * CELL + CELL / 2, '#6ee7f9');
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snakeBest', String(best)); } catch (e) { /* ignore */ }
    }
    overlayTitle.textContent = 'Game Over';
    overlayText.textContent = 'Final score: ' + score;
    setTimeout(() => overlay.classList.add('show'), 250);
  }

  function updateParticles() {
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 0.03; }
    particles = particles.filter(p => p.life > 0);
  }

  function loop(now) {
    rafId = requestAnimationFrame(loop);
    const dt = now - last;
    last = now;
    foodPulse += dt * 0.005;
    if (alive && !paused) {
      acc += dt;
      while (acc >= stepMs) { acc -= stepMs; if (alive) step(); }
    }
    updateParticles();
    draw();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(0, 0, 400, 400);
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= SIZE; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 400); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(400, i * CELL); ctx.stroke();
    }

    const pulse = 0.34 + Math.sin(foodPulse) * 0.06;
    const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
    ctx.fillStyle = '#f472b6';
    ctx.shadowColor = '#f472b6';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(1, snake.length - 1);
      const head = i === 0;
      const r = Math.floor(56 + (110 - 56) * (1 - t));
      const g = Math.floor(189 + (231 - 189) * (1 - t));
      const b = 248;
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      if (head) { ctx.shadowColor = '#6ee7f9'; ctx.shadowBlur = 12; }
      roundRect(s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3, head ? 6 : 4);
      ctx.fill();
      ctx.shadowBlur = 0;
      if (head) {
        ctx.fillStyle = '#0a0e1a';
        const ex = s.x * CELL + CELL / 2, ey = s.y * CELL + CELL / 2;
        const off = CELL * 0.18;
        const dx = dir.x * off, dy = dir.y * off;
        const perpx = dir.y * off, perpy = dir.x * off;
        ctx.beginPath(); ctx.arc(ex + dx + perpx, ey + dy + perpy, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex + dx - perpx, ey + dy - perpy, 2, 0, Math.PI * 2); ctx.fill();
      }
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (paused && alive) {
      ctx.fillStyle = 'rgba(9,11,20,0.6)';
      ctx.fillRect(0, 0, 400, 400);
      ctx.fillStyle = '#e8ecf8';
      ctx.font = '600 28px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Paused', 200, 205);
    }
  }

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k) || ['w','a','s','d','p','r'].includes(k)) e.preventDefault();
    if (k === 'p') { togglePause(); return; }
    if (k === 'r') { reset(); return; }
    const map = {
      arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 },
      arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
      arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
      arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 }
    };
    const nd = map[k];
    if (!nd || !alive || gameOver) return;
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    nextDir = nd;
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => { const t = e.touches[0]; touchStart = { x: t.clientX, y: t.clientY }; }, { passive: true });
  canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    const nd = Math.abs(dx) > Math.abs(dy) ? { x: dx > 0 ? 1 : -1, y: 0 } : { x: 0, y: dy > 0 ? 1 : -1 };
    if (!alive || (nd.x === -dir.x && nd.y === -dir.y)) return;
    nextDir = nd;
  });

  function togglePause() {
    if (!alive || gameOver) return;
    paused = !paused;
    document.getElementById('pause').textContent = paused ? 'Resume' : 'Pause';
  }

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('pause').addEventListener('click', togglePause);
  overlayBtn.addEventListener('click', reset);
  muteBtn.addEventListener('click', () => {
    const m = sfx.toggleMute();
    muteBtn.textContent = 'Sound: ' + (m ? 'Off' : 'On');
  });

  reset();
})();
</script>
</body>
</html>
