<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Says — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; align-items: center; flex-wrap: wrap; justify-content: center; }
  .hud span b { color: #6ee7f9; }
  button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: #e8ecf8;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { background: rgba(110,231,249,0.15); }
  button.active { background: rgba(110,231,249,0.25); border-color: #6ee7f9; }
  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 18px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
  }
  .pad {
    width: 150px;
    height: 150px;
    border-radius: 16px;
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.1s, transform 0.1s;
    border: none;
  }
  .pad.lit { opacity: 1; transform: scale(1.03); }
  .pad.green { background: radial-gradient(circle at 30% 30%, #4ade80, #15803d); }
  .pad.red { background: radial-gradient(circle at 30% 30%, #f87171, #b91c1c); }
  .pad.yellow { background: radial-gradient(circle at 30% 30%, #facc15, #a16207); }
  .pad.blue { background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8); }
  .status { font-size: 1.05rem; min-height: 1.4em; }
  .status b { color: #6ee7f9; }
  .hint { color: #9aa3bf; font-size: 0.8rem; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Simon Says</h1>
  <div class="hud">
    <span>Round: <b id="round">1</b></span>
    <span>High Score: <b id="high">0</b></span>
    <button id="mode">Mode: Casual</button>
    <button id="start">Start</button>
  </div>
  <div class="board">
    <button class="pad green" id="pad0" aria-label="green"></button>
    <button class="pad red" id="pad1" aria-label="red"></button>
    <button class="pad yellow" id="pad2" aria-label="yellow"></button>
    <button class="pad blue" id="pad3" aria-label="blue"></button>
  </div>
  <div class="status" id="status">Press Start to play</div>
  <div class="hint">Watch the sequence, then repeat it. Strict mode: one mistake ends the game.</div>

<script>
(function () {
  const COLORS = ['green', 'red', 'yellow', 'blue'];
  const FREQS = [392, 329.63, 261.63, 246.94]; // G4 E4 C4 B3
  const pads = COLORS.map((_, i) => document.getElementById('pad' + i));
  const roundEl = document.getElementById('round');
  const highEl = document.getElementById('high');
  const statusEl = document.getElementById('status');
  const modeBtn = document.getElementById('mode');
  const startBtn = document.getElementById('start');

  let high = 0;
  try { high = parseInt(localStorage.getItem('simonHigh') || '0', 10) || 0; } catch (e) { /* ignore */ }
  highEl.textContent = high;

  let strict = false;
  let sequence = [];
  let playerIndex = 0;
  let playing = false;   // simon is showing sequence
  let round = 1;
  let audioCtx = null;

  function beep(freq) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    } catch (e) { /* audio unavailable — ignore */ }
  }

  function lightPad(i, dur) {
    pads[i].classList.add('lit');
    beep(FREQS[i]);
    setTimeout(() => pads[i].classList.remove('lit'), dur);
  }

  function playSequence() {
    playing = true;
    playerIndex = 0;
    let delay = 600;
    sequence.forEach((v, i) => {
      setTimeout(() => {
        lightPad(v, 350);
        if (i === sequence.length - 1) {
          setTimeout(() => { playing = false; statusEl.innerHTML = 'Your turn &mdash; repeat the sequence!'; }, 500);
        }
      }, delay);
      delay += 700;
    });
  }

  function nextRound() {
    round++;
    roundEl.textContent = round;
    if (round > high) {
      high = round;
      highEl.textContent = high;
      try { localStorage.setItem('simonHigh', String(high)); } catch (e) { /* ignore */ }
    }
    sequence.push(Math.floor(Math.random() * 4));
    setTimeout(playSequence, 600);
  }

  function gameOver(msg) {
    playing = false;
    statusEl.innerHTML = '<b>' + msg + '</b> &mdash; reached round ' + round + '. Press Start to try again.';
    startBtn.textContent = 'Start';
  }

  function startGame() {
    sequence = [Math.floor(Math.random() * 4)];
    round = 1;
    roundEl.textContent = '1';
    startBtn.textContent = 'Restart';
    statusEl.textContent = 'Watch...';
    setTimeout(playSequence, 700);
  }

  function pressPad(i) {
    if (playing) return;
    lightPad(i, 250);
    if (sequence.length === 0) return;
    if (sequence[playerIndex] === i) {
      playerIndex++;
      if (playerIndex === sequence.length) {
        statusEl.textContent = 'Correct! Next round...';
        setTimeout(nextRound, 800);
      }
    } else {
      if (strict) {
        gameOver('Wrong! Game over');
      } else {
        statusEl.textContent = 'Wrong! Watch again...';
        setTimeout(playSequence, 900);
      }
    }
  }

  pads.forEach((pad, i) => pad.addEventListener('click', () => pressPad(i)));

  modeBtn.addEventListener('click', () => {
    strict = !strict;
    modeBtn.textContent = 'Mode: ' + (strict ? 'Strict' : 'Casual');
    if (strict) modeBtn.classList.add('active'); else modeBtn.classList.remove('active');
  });
  startBtn.addEventListener('click', startGame);

  startBtn.textContent = 'Start';
})();
</script>
</body>
</html>
