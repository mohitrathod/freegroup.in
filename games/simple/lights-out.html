<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lights Out — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; align-items: center; }
  .hud span b { color: #6ee7f9; }
  canvas { background: #05070f; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 0 60px rgba(250,204,21,0.08); touch-action: none; max-width: 100%; display: block; cursor: pointer; }
  button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8; padding: 8px 18px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  button:hover { background: rgba(110,231,249,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; text-align: center; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(9,11,20,0.82); border-radius: 12px; }
  #overlay.show { display: flex; }
  #overlay .panel { text-align: center; padding: 24px 32px; }
  #overlay h2 { font-size: 1.8rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 16px; }
  .wrap { position: relative; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Lights Out</h1>
  <div class="hud">
    <span>Moves: <b id="moves">0</b></span>
    <span>Best: <b id="best">0</b></span>
    <button id="newgame">New Puzzle</button>
    <button id="mute">Sound: On</button>
  </div>
  <div class="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay"><div class="panel"><h2>Puzzle Solved!</h2><p id="oText">Moves: 0</p><button id="oBtn">New Puzzle</button></div></div>
  </div>
  <div class="hint">Click a light to toggle it and its neighbors &middot; turn all lights off</div>

<script src="sfx.js"></script>
<script>
(function () {
  const SIZE = 5, TILE = 80;
  const W = SIZE * TILE, H = SIZE * TILE;
  const canvas = document.getElementById('game'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const movesEl = document.getElementById('moves'), bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay'), oText = document.getElementById('oText');
  const muteBtn = document.getElementById('mute');
  const sfx = window.SFX || { click(){}, win(){}, toggleMute(){ return false; } };

  let grid, moves, animT;
  let best = 0;
  try { best = parseInt(localStorage.getItem('lightsOutBest') || '0', 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;

  function reset() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
    // random solvable: apply random clicks
    const clicks = 8 + Math.floor(Math.random() * 10);
    for (let i = 0; i < clicks; i++) toggle(Math.floor(Math.random() * SIZE), Math.floor(Math.random() * SIZE), false);
    moves = 0; movesEl.textContent = '0'; animT = 0;
    overlay.classList.remove('show');
  }

  function toggle(r, c, count) {
    grid[r][c] = !grid[r][c];
    if (r > 0) grid[r - 1][c] = !grid[r - 1][c];
    if (r < SIZE - 1) grid[r + 1][c] = !grid[r + 1][c];
    if (c > 0) grid[r][c - 1] = !grid[r][c - 1];
    if (c < SIZE - 1) grid[r][c + 1] = !grid[r][c + 1];
    if (count !== false) { moves++; movesEl.textContent = moves; sfx.click(); checkWin(); }
  }

  function checkWin() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c]) return;
    win();
  }

  function win() {
    if (moves < best || best === 0) { best = moves; bestEl.textContent = best; try { localStorage.setItem('lightsOutBest', String(best)); } catch (e) {} }
    oText.textContent = 'Moves: ' + moves; overlay.classList.add('show'); sfx.win();
  }

  function loop() { requestAnimationFrame(loop); animT++; draw(); }

  function draw() {
    ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, W, H);
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const x = c * TILE, y = r * TILE;
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
      if (grid[r][c]) {
        const pulse = Math.sin(animT * 0.05 + r * 0.3 + c * 0.3) * 4;
        ctx.fillStyle = '#facc15'; ctx.shadowColor = '#facc15'; ctx.shadowBlur = 20 + pulse;
        ctx.fillRect(x + 8, y + 8, TILE - 16, TILE - 16);
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(x + 8, y + 8, TILE - 16, TILE - 16);
      }
    }
  }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width), y = (e.clientY - rect.top) * (H / rect.height);
    const r = Math.floor(y / TILE), c = Math.floor(x / TILE);
    if (r >= 0 && r < SIZE && c >= 0 && c < SIZE) toggle(r, c, true);
  });
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.changedTouches[0];
    const x = (touch.clientX - rect.left) * (W / rect.width), y = (touch.clientY - rect.top) * (H / rect.height);
    const r = Math.floor(y / TILE), c = Math.floor(x / TILE);
    if (r >= 0 && r < SIZE && c >= 0 && c < SIZE) toggle(r, c, true);
  }, { passive: false });

  document.getElementById('newgame').addEventListener('click', reset);
  document.getElementById('oBtn').addEventListener('click', reset);
  muteBtn.addEventListener('click', () => { const m = sfx.toggleMute(); muteBtn.textContent = 'Sound: ' + (m ? 'Off' : 'On'); });

  reset();
  loop();
})();
</script>
</body>
</html>
