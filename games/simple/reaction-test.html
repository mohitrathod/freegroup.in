<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Test — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 24px; font-size: 0.95rem; }
  .hud span b { color: #6ee7f9; }
  .pad {
    width: min(90vw, 460px); height: 300px; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; text-align: center; padding: 20px;
    border: 1px solid rgba(255,255,255,0.12); transition: background 0.1s;
  }
  .pad.wait { background: #3b2a55; }
  .pad.ready { background: #15803d; }
  .pad.now { background: #dc2626; }
  .pad.idle { background: rgba(255,255,255,0.05); }
  .pad .big { font-size: 2.4rem; font-weight: 700; }
  .pad .sub { color: rgba(255,255,255,0.75); font-size: 0.95rem; margin-top: 8px; }
  .hint { color: #9aa3bf; font-size: 0.8rem; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Reaction Test</h1>
  <div class="hud">
    <span>Last: <b id="last">--</b></span>
    <span>Best: <b id="best">--</b></span>
    <span>Avg: <b id="avg">--</b></span>
  </div>
  <div class="pad idle" id="pad">
    <div class="big" id="big">Click to start</div>
    <div class="sub" id="sub">Wait for green, then click as fast as you can</div>
  </div>
  <div class="hint">Green = click now. Clicking too early resets the round.</div>

<script src="sfx.js"></script>
<script>
(function () {
  const pad = document.getElementById('pad'), big = document.getElementById('big'), sub = document.getElementById('sub');
  const lastEl = document.getElementById('last'), bestEl = document.getElementById('best'), avgEl = document.getElementById('avg');
  const sfx = window.SFX || { blip(){}, hit(){}, win(){} };
  let state = 'idle', timer = null, startTime = 0, times = [], best = null;
  try { best = localStorage.getItem('reactionBest'); best = best ? parseInt(best, 10) : null; } catch (e) { /* ignore */ }
  bestEl.textContent = best === null ? '--' : best + ' ms';

  function setState(s) { state = s; pad.className = 'pad ' + s; }

  function arm() {
    setState('wait');
    big.textContent = 'Wait for green...';
    sub.textContent = '';
    const delay = 1200 + Math.random() * 2800;
    timer = setTimeout(() => {
      setState('now'); big.textContent = 'CLICK!'; startTime = performance.now(); sfx.blip(880);
    }, delay);
  }

  function click() {
    if (state === 'idle') { arm(); return; }
    if (state === 'wait') {
      clearTimeout(timer); setState('idle');
      big.textContent = 'Too early!'; sub.textContent = 'Click to try again'; sfx.hit();
      return;
    }
    if (state === 'now') {
      const ms = Math.round(performance.now() - startTime);
      times.push(ms);
      lastEl.textContent = ms + ' ms';
      if (best === null || ms < best) { best = ms; bestEl.textContent = best + ' ms'; try { localStorage.setItem('reactionBest', String(best)); } catch (e) {} sfx.win(); }
      const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
      avgEl.textContent = avg + ' ms';
      setState('ready'); big.textContent = ms + ' ms'; sub.textContent = 'Click for another round';
      state = 'idle';
      return;
    }
    if (state === 'ready') arm();
  }

  pad.addEventListener('mousedown', click);
  pad.addEventListener('touchstart', (e) => { e.preventDefault(); click(); }, { passive: false });
})();
</script>
</body>
</html>
