<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helicopter — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; align-items: center; }
  .hud span b { color: #6ee7f9; }
  .wrap { position: relative; }
  canvas { background: #05070f; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 0 60px rgba(103,232,249,0.08); touch-action: none; max-width: 100%; display: block; }
  button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8; padding: 8px 18px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  button:hover { background: rgba(110,231,249,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; text-align: center; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(9,11,20,0.82); border-radius: 12px; }
  #overlay.show { display: flex; }
  #overlay .panel { text-align: center; padding: 24px 32px; }
  #overlay h2 { font-size: 1.8rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 16px; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Helicopter</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
    <button id="mute">Sound: On</button>
  </div>
  <div class="wrap">
    <canvas id="game" width="600" height="400"></canvas>
    <div id="overlay"><div class="panel"><h2>Crashed!</h2><p id="oText">Score: 0</p><button id="oBtn">Play Again</button></div></div>
  </div>
  <div class="hint">Click / hold / tap to rise, release to fall &middot; fly through the cave</div>

<script src="sfx.js"></script>
<script>
(function () {
  const W = 600, H = 400;
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay'), oText = document.getElementById('oText');
  const muteBtn = document.getElementById('mute');
  const sfx = window.SFX || { blip(){}, explosion(){}, lose(){}, toggleMute(){ return false; } };

  let heli, walls, score, running, thrust, animT;
  let best = 0;
  try { best = parseInt(localStorage.getItem('helicopterBest') || '0', 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;

  function reset() {
    heli = { x: 100, y: H / 2, vy: 0, r: 12 };
    walls = [{ x: W, top: 60, bot: 60 }];
    score = 0; running = true; thrust = false; animT = 0;
    scoreEl.textContent = '0'; overlay.classList.remove('show');
  }

  function spawnWall() {
    const gap = Math.max(120, 180 - score / 100);
    const top = 40 + Math.random() * (H - gap - 80);
    const bot = H - top - gap;
    walls.push({ x: W, top, bot });
  }

  function loop() { requestAnimationFrame(loop); if (running) update(); draw(); }

  function update() {
    animT++;
    if (thrust) heli.vy -= 0.5; else heli.vy += 0.35;
    heli.vy = Math.max(-6, Math.min(6, heli.vy));
    heli.y += heli.vy;
    if (heli.y - heli.r < 0 || heli.y + heli.r > H) { end(); return; }
    for (const w of walls) {
      w.x -= 3 + score / 400;
      if (!w.passed && w.x + 30 < heli.x) { w.passed = true; score++; scoreEl.textContent = score; sfx.blip(520); }
      if (heli.x + heli.r > w.x && heli.x - heli.r < w.x + 30) {
        if (heli.y - heli.r < w.top || heli.y + heli.r > H - w.bot) { end(); return; }
      }
    }
    walls = walls.filter(w => w.x > -50);
    if (walls.length === 0 || walls[walls.length - 1].x < W - 200) spawnWall();
  }

  function end() {
    running = false; sfx.explosion(); sfx.lose();
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('helicopterBest', String(best)); } catch (e) {} }
    oText.textContent = 'Score: ' + score; overlay.classList.add('show');
  }

  function draw() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, '#1a2340'); gradient.addColorStop(1, '#0a0f1a');
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, W, H);
    // walls
    for (const w of walls) {
      ctx.fillStyle = '#3b4fa0';
      ctx.fillRect(w.x, 0, 30, w.top);
      ctx.fillRect(w.x, H - w.bot, 30, w.bot);
      ctx.strokeStyle = '#6b7fa0'; ctx.lineWidth = 2;
      ctx.strokeRect(w.x, 0, 30, w.top);
      ctx.strokeRect(w.x, H - w.bot, 30, w.bot);
    }
    // heli body
    ctx.fillStyle = '#67e8f9'; ctx.shadowColor = '#67e8f9'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(heli.x, heli.y, heli.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // rotor
    const rotorAngle = (animT * 0.4) % (Math.PI * 2);
    ctx.strokeStyle = '#e8ecf8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(heli.x - Math.cos(rotorAngle) * 16, heli.y - 14 - Math.sin(rotorAngle) * 3); ctx.lineTo(heli.x + Math.cos(rotorAngle) * 16, heli.y - 14 + Math.sin(rotorAngle) * 3); ctx.stroke();
    // tail
    ctx.beginPath(); ctx.moveTo(heli.x, heli.y); ctx.lineTo(heli.x - 10, heli.y + 4); ctx.stroke();
  }

  function startThrust() { thrust = true; }
  function stopThrust() { thrust = false; }
  canvas.addEventListener('mousedown', startThrust);
  canvas.addEventListener('mouseup', stopThrust);
  document.addEventListener('keydown', (e) => { if (e.key === ' ') { startThrust(); e.preventDefault(); } });
  document.addEventListener('keyup', (e) => { if (e.key === ' ') stopThrust(); });
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startThrust(); }, { passive: false });
  canvas.addEventListener('touchend', (e) => { e.preventDefault(); stopThrust(); }, { passive: false });

  document.getElementById('oBtn').addEventListener('click', reset);
  muteBtn.addEventListener('click', () => { const m = sfx.toggleMute(); muteBtn.textContent = 'Sound: ' + (m ? 'Off' : 'On'); });

  reset();
  loop();
})();
</script>
</body>
</html>
