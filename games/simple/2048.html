<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; }
  .hud span b { color: #6ee7f9; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(64px, 100px));
    gap: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 10px;
    touch-action: none;
  }
  .tile {
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 700;
    background: rgba(255,255,255,0.05);
    color: #9aa3bf;
    transition: transform 0.12s ease, background 0.12s;
  }
  .tile.t2 { background: #1e2747; color: #e8ecf8; }
  .tile.t4 { background: #27335c; color: #e8ecf8; }
  .tile.t8 { background: #f59e0b; color: #0d1120; }
  .tile.t16 { background: #f97316; color: #0d1120; }
  .tile.t32 { background: #ef4444; color: #0d1120; }
  .tile.t64 { background: #dc2626; color: #0d1120; }
  .tile.t128 { background: #facc15; color: #0d1120; }
  .tile.t256 { background: #a3e635; color: #0d1120; }
  .tile.t512 { background: #4ade80; color: #0d1120; }
  .tile.t1024 { background: #22d3ee; color: #0d1120; }
  .tile.t2048 { background: #a78bfa; color: #0d1120; }
  .tile.tbig { background: linear-gradient(135deg, #f472b6, #a78bfa); color: #0d1120; font-size: 1.4rem; }
  button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: #e8ecf8;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { background: rgba(110,231,249,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(9,11,20,0.85); z-index: 10; }
  #overlay.show { display: flex; }
  #overlay .panel { text-align: center; padding: 28px 36px; }
  #overlay h2 { font-size: 2rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 18px; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>2048</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <div class="board" id="board"></div>
  <button id="restart">Restart</button>
  <div class="hint">Arrow keys / WASD / swipe to move</div>

  <div id="overlay">
    <div class="panel">
      <h2 id="overlayTitle">Game Over</h2>
      <p id="overlayText">Score: 0</p>
      <button id="overlayBtn">Try Again</button>
    </div>
  </div>

<script>
(function () {
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');

  let grid, score, best, won, over;
  try { best = parseInt(localStorage.getItem('game2048Best') || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  function empty() { return Array.from({ length: 4 }, () => Array(4).fill(0)); }

  function newTile() {
    const empties = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!grid[r][c]) empties.push([r, c]);
    if (!empties.length) return;
    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function reset() {
    grid = empty();
    score = 0;
    won = false;
    over = false;
    scoreEl.textContent = '0';
    overlay.classList.remove('show');
    newTile();
    newTile();
    render();
  }

  function render() {
    boardEl.innerHTML = '';
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const v = grid[r][c];
        const el = document.createElement('div');
        el.className = 'tile' + (v ? ' t' + v : '') + (v > 2048 ? ' tbig' : '');
        el.textContent = v || '';
        boardEl.appendChild(el);
      }
    }
  }

  function slideRow(row) {
    const vals = row.filter(v => v);
    const out = [];
    let gained = 0;
    for (let i = 0; i < vals.length; i++) {
      if (vals[i] === vals[i + 1]) {
        out.push(vals[i] * 2);
        gained += vals[i] * 2;
        i++;
      } else {
        out.push(vals[i]);
      }
    }
    while (out.length < 4) out.push(0);
    return { out, gained };
  }

  function move(dir) {
    if (over || won) return;
    const before = JSON.stringify(grid);
    let gained = 0;
    for (let i = 0; i < 4; i++) {
      let line;
      if (dir === 'left') line = grid[i];
      else if (dir === 'right') line = grid[i].slice().reverse();
      else if (dir === 'up') line = grid.map(r => r[i]);
      else line = grid.map(r => r[i]).reverse();
      const { out, gained: g } = slideRow(line);
      gained += g;
      if (dir === 'left') grid[i] = out;
      else if (dir === 'right') grid[i] = out.reverse();
      else if (dir === 'up') for (let r = 0; r < 4; r++) grid[r][i] = out[r];
      else for (let r = 0; r < 4; r++) grid[r][i] = out.reverse()[r];
    }
    if (JSON.stringify(grid) === before) return; // no movement
    score += gained;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('game2048Best', String(best)); } catch (e) { /* ignore */ }
    }
    newTile();
    render();
    checkState();
  }

  function checkState() {
    if (!won && grid.some(r => r.some(v => v === 2048))) {
      won = true;
      overlayTitle.textContent = 'You Win!';
      overlayText.textContent = 'Reached 2048 with score ' + score + '. Keep going or restart?';
      overlay.classList.add('show');
      return;
    }
    // game over check
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (!grid[r][c]) return;
        if (c < 3 && grid[r][c] === grid[r][c + 1]) return;
        if (r < 3 && grid[r][c] === grid[r + 1][c]) return;
      }
    }
    over = true;
    overlayTitle.textContent = 'Game Over';
    overlayText.textContent = 'Final score: ' + score;
    overlay.classList.add('show');
  }

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) e.preventDefault();
    const map = { arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down' };
    if (map[k]) move(map[k]);
  });

  // swipe
  let ts = null;
  const board = document.querySelector('.board');
  board.addEventListener('touchstart', (e) => { ts = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
  board.addEventListener('touchend', (e) => {
    if (!ts) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - ts.x, dy = t.clientY - ts.y;
    ts = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  });

  document.getElementById('restart').addEventListener('click', reset);
  overlayBtn.addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
