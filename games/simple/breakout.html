<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; }
  .hud span b { color: #6ee7f9; }
  canvas {
    background: #0a0e1a;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(244, 114, 182, 0.08);
    touch-action: none;
    max-width: 100%;
  }
  .controls { display: flex; gap: 10px; }
  button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: #e8ecf8;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { background: rgba(244,114,182,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(9,11,20,0.85); z-index: 10; }
  #overlay.show { display: flex; }
  #overlay .panel { text-align: center; padding: 28px 36px; }
  #overlay h2 { font-size: 2rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 18px; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Breakout</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Level: <b id="level">1</b></span>
    <span>Lives: <b id="lives">3</b></span>
  </div>
  <canvas id="game" width="640" height="440"></canvas>
  <div class="controls">
    <button id="restart">Restart</button>
    <button id="pause">Pause</button>
  </div>
  <div class="hint">Mouse / touch to move paddle &middot; arrow keys too &middot; P pause</div>

  <div id="overlay">
    <div class="panel">
      <h2 id="overlayTitle">Game Over</h2>
      <p id="overlayText">Final score: 0</p>
      <button id="overlayBtn">Play Again</button>
    </div>
  </div>

<script>
(function () {
  const W = 640, H = 440;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');

  const PADDLE_W = 100, PADDLE_H = 14, PADDLE_Y = H - 34;
  const BALL_R = 8;
  const BRICK_ROWS = 5, BRICK_COLS = 10;
  const BRICK_W = 56, BRICK_H = 18, BRICK_GAP = 6, BRICK_TOP = 60;
  const BRICK_COLORS = ['#f87171', '#fb923c', '#facc15', '#4ade80', '#60a5fa'];

  let paddle, ball, bricks, score, level, lives, running, paused, rafId, keys = { left: false, right: false };

  function reset() {
    score = 0; level = 1; lives = 3;
    overlay.classList.remove('show');
    document.getElementById('pause').textContent = 'Pause';
    paused = false;
    buildLevel();
    resetBall();
    scoreEl.textContent = '0'; levelEl.textContent = '1'; livesEl.textContent = '3';
    running = true;
    if (!rafId) loop();
  }

  function buildLevel() {
    bricks = [];
    for (let r = 0; r < BRICK_ROWS; r++) {
      for (let c = 0; c < BRICK_COLS; c++) {
        bricks.push({
          x: 20 + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          color: BRICK_COLORS[r],
          alive: true
        });
      }
    }
  }

  function resetBall() {
    paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W };
    ball = { x: W / 2, y: PADDLE_Y - BALL_R - 2, vx: 0, vy: 0 };
  }

  function launch() {
    if (ball.vx !== 0 || ball.vy !== 0) return;
    const angle = -Math.PI / 2 + (Math.random() * 0.5 - 0.25);
    const speed = 6.5 + level * 0.35;
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
  }

  function loop() {
    rafId = requestAnimationFrame(loop);
    if (!running || paused) return;
    if (ball.vx === 0 && ball.vy === 0) {
      // ball stuck on paddle, follow it
      ball.x = paddle.x + paddle.w / 2;
    }
    // paddle movement
    const target = paddle.x + (keys.right ? 9 : 0) - (keys.left ? 9 : 0);
    paddle.x = Math.max(0, Math.min(W - paddle.w, target));
    paddle.x += (mouseX !== null ? (mouseX - paddle.x - paddle.w / 2) * 0.25 : 0);

    // ball movement
    ball.x += ball.vx;
    ball.y += ball.vy;

    // walls
    if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < BALL_R) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // paddle collision
    if (ball.vy > 0 &&
        ball.y + BALL_R >= PADDLE_Y && ball.y + BALL_R <= PADDLE_Y + PADDLE_H + 6 &&
        ball.x >= paddle.x - BALL_R && ball.x <= paddle.x + paddle.w + BALL_R) {
      const rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const angle = rel * 0.9 - Math.PI / 2;
      const speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.cos(angle) * speed;
      ball.vy = Math.sin(angle) * speed;
      ball.y = PADDLE_Y - BALL_R - 1;
      launch();
    }

    // bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + BRICK_W &&
          ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + BRICK_H) {
        b.alive = false;
        score += 10;
        scoreEl.textContent = score;
        // simple bounce
        const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + BRICK_W - (ball.x - BALL_R));
        const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + BRICK_H - (ball.y - BALL_R));
        if (overlapX < overlapY) ball.vx = -ball.vx; else ball.vy = -ball.vy;
        break;
      }
    }

    // level complete
    if (bricks.every(b => !b.alive)) {
      level++;
      levelEl.textContent = level;
      buildLevel();
      resetBall();
    }

    // lose ball
    if (ball.y - BALL_R > H) {
      lives--;
      livesEl.textContent = lives;
      if (lives <= 0) { endGame(); return; }
      resetBall();
    }

    draw();
  }

  function endGame() {
    running = false;
    cancelAnimationFrame(rafId);
    rafId = null;
    overlayTitle.textContent = 'Game Over';
    overlayText.textContent = 'Final score: ' + score + ' (level ' + level + ')';
    overlay.classList.add('show');
  }

  function draw() {
    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(0, 0, W, H);
    // bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 8;
      ctx.fillRect(b.x, b.y, BRICK_W, BRICK_H);
      ctx.shadowBlur = 0;
    }
    // paddle
    ctx.fillStyle = '#6ee7f9';
    ctx.shadowColor = '#6ee7f9';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    ctx.fill();
    ctx.shadowBlur = 0;
    // ball
    ctx.fillStyle = '#f472b6';
    ctx.shadowColor = '#f472b6';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  let mouseX = null;
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
  });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.touches[0].clientX - rect.left) * (W / rect.width);
  }, { passive: false });
  canvas.addEventListener('click', launch);

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') keys.left = true;
    if (k === 'arrowright' || k === 'd') keys.right = true;
    if (k === 'p') togglePause();
    if (k === ' ') launch();
  });
  document.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') keys.left = false;
    if (k === 'arrowright' || k === 'd') keys.right = false;
  });

  function togglePause() {
    if (!running) return;
    paused = !paused;
    document.getElementById('pause').textContent = paused ? 'Resume' : 'Pause';
  }

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('pause').addEventListener('click', togglePause);
  overlayBtn.addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
