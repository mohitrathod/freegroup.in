<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; }
  .hud span b { color: #6ee7f9; }
  svg { background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
  .word { font-size: 2rem; letter-spacing: 0.35em; font-weight: 700; min-height: 1.4em; }
  .word .miss { color: #f87171; }
  .category { color: #9aa3bf; font-size: 0.85rem; }
  .keys { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; max-width: 460px; }
  .keys button {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8;
    padding: 8px 0; border-radius: 6px; font-size: 0.95rem; cursor: pointer; text-transform: uppercase;
  }
  .keys button:hover:not(:disabled) { background: rgba(110,231,249,0.18); }
  .keys button.good { background: rgba(74,222,128,0.25); border-color: #4ade80; }
  .keys button.bad { background: rgba(248,113,113,0.2); border-color: #f87171; opacity: 0.6; }
  .keys button:disabled { cursor: default; }
  .status { font-size: 1.1rem; min-height: 1.4em; }
  .status b.win { color: #4ade80; } .status b.lose { color: #f87171; }
  .newbtn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8; padding: 8px 20px; border-radius: 8px; cursor: pointer; }
  .newbtn:hover { background: rgba(110,231,249,0.15); }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Hangman</h1>
  <div class="hud"><span>Wins: <b id="wins">0</b></span><span>Losses: <b id="losses">0</b></span></div>
  <svg width="180" height="200" viewBox="0 0 180 200">
    <line x1="20" y1="190" x2="120" y2="190" stroke="#6ee7f9" stroke-width="4"/>
    <line x1="50" y1="190" x2="50" y2="20" stroke="#6ee7f9" stroke-width="4"/>
    <line x1="48" y1="20" x2="130" y2="20" stroke="#6ee7f9" stroke-width="4"/>
    <line x1="130" y1="20" x2="130" y2="45" stroke="#6ee7f9" stroke-width="4"/>
    <circle id="p0" cx="130" cy="60" r="15" stroke="#f472b6" stroke-width="4" fill="none" style="display:none"/>
    <line id="p1" x1="130" y1="75" x2="130" y2="125" stroke="#f472b6" stroke-width="4" style="display:none"/>
    <line id="p2" x1="130" y1="90" x2="105" y2="110" stroke="#f472b6" stroke-width="4" style="display:none"/>
    <line id="p3" x1="130" y1="90" x2="155" y2="110" stroke="#f472b6" stroke-width="4" style="display:none"/>
    <line id="p4" x1="130" y1="125" x2="110" y2="160" stroke="#f472b6" stroke-width="4" style="display:none"/>
    <line id="p5" x1="130" y1="125" x2="150" y2="160" stroke="#f472b6" stroke-width="4" style="display:none"/>
  </svg>
  <div class="category" id="category"></div>
  <div class="word" id="word"></div>
  <div class="status" id="status">Guess the word!</div>
  <div class="keys" id="keys"></div>
  <button class="newbtn" id="newGame">New Word</button>

<script src="sfx.js"></script>
<script>
(function () {
  const WORDS = [
    { w: 'JAVASCRIPT', c: 'Programming' }, { w: 'MOUNTAIN', c: 'Nature' }, { w: 'ELEPHANT', c: 'Animals' },
    { w: 'GUITAR', c: 'Music' }, { w: 'PYRAMID', c: 'Places' }, { w: 'OXYGEN', c: 'Science' },
    { w: 'RAINBOW', c: 'Nature' }, { w: 'COMPUTER', c: 'Technology' }, { w: 'VOLCANO', c: 'Nature' },
    { w: 'KANGAROO', c: 'Animals' }, { w: 'GALAXY', c: 'Space' }, { w: 'DIAMOND', c: 'Objects' },
    { w: 'PENGUIN', c: 'Animals' }, { w: 'JOURNEY', c: 'Concepts' }, { w: 'PUMPKIN', c: 'Food' },
    { w: 'WIZARD', c: 'Fantasy' }, { w: 'OCTOPUS', c: 'Animals' }, { w: 'THUNDER', c: 'Weather' }
  ];
  const MAX = 6;
  const wordEl = document.getElementById('word'), keysEl = document.getElementById('keys');
  const statusEl = document.getElementById('status'), catEl = document.getElementById('category');
  const sfx = window.SFX || { blip(){}, hit(){}, win(){}, lose(){} };
  let target, guessed, wrong, done;
  let stats = { wins: 0, losses: 0 };
  try { const s = JSON.parse(localStorage.getItem('hangmanStats') || 'null'); if (s) stats = s; } catch (e) { /* ignore */ }
  updateStats();

  function newGame() {
    const pick = WORDS[Math.floor(Math.random() * WORDS.length)];
    target = pick.w; catEl.textContent = 'Category: ' + pick.c;
    guessed = new Set(); wrong = 0; done = false;
    statusEl.textContent = 'Guess the word!';
    for (let i = 0; i < 6; i++) document.getElementById('p' + i).style.display = 'none';
    renderWord(); renderKeys();
  }

  function renderWord() {
    wordEl.innerHTML = target.split('').map(ch => guessed.has(ch) ? ch : '_').join(' ');
  }

  function renderKeys() {
    keysEl.innerHTML = '';
    for (const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') {
      const b = document.createElement('button');
      b.textContent = ch;
      if (guessed.has(ch)) { b.disabled = true; b.classList.add(target.includes(ch) ? 'good' : 'bad'); }
      b.addEventListener('click', () => guess(ch));
      keysEl.appendChild(b);
    }
  }

  function guess(ch) {
    if (done || guessed.has(ch)) return;
    guessed.add(ch);
    if (target.includes(ch)) { sfx.blip(700); renderWord(); check(); }
    else { wrong++; sfx.hit(); document.getElementById('p' + (wrong - 1)).style.display = ''; if (wrong >= MAX) lose(); }
    renderKeys();
  }

  function check() {
    if (target.split('').every(ch => guessed.has(ch))) {
      done = true; stats.wins++; updateStats(); save();
      statusEl.innerHTML = '<b class="win">You got it!</b>'; sfx.win();
    }
  }

  function lose() {
    done = true; stats.losses++; updateStats(); save();
    wordEl.innerHTML = target.split('').map(ch => guessed.has(ch) ? ch : '<span class="miss">' + ch + '</span>').join(' ');
    statusEl.innerHTML = '<b class="lose">Game over!</b> The word was ' + target; sfx.lose();
  }

  function updateStats() { document.getElementById('wins').textContent = stats.wins; document.getElementById('losses').textContent = stats.losses; }
  function save() { try { localStorage.setItem('hangmanStats', JSON.stringify(stats)); } catch (e) { /* ignore */ } }

  document.addEventListener('keydown', (e) => { const ch = e.key.toUpperCase(); if (/^[A-Z]$/.test(ch)) guess(ch); });
  document.getElementById('newGame').addEventListener('click', newGame);
  newGame();
})();
</script>
</body>
</html>
