<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Dodge — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; align-items: center; }
  .hud span b { color: #6ee7f9; }
  .wrap { position: relative; }
  canvas { background: #05070f; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 0 60px rgba(248,113,113,0.08); touch-action: none; max-width: 100%; display: block; }
  button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8; padding: 8px 18px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  button:hover { background: rgba(110,231,249,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; text-align: center; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(9,11,20,0.82); border-radius: 12px; }
  #overlay.show { display: flex; }
  #overlay .panel { text-align: center; padding: 24px 32px; }
  #overlay h2 { font-size: 1.8rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 16px; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Car Dodge</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
    <button id="mute">Sound: On</button>
  </div>
  <div class="wrap">
    <canvas id="game" width="400" height="600"></canvas>
    <div id="overlay"><div class="panel"><h2>Crashed!</h2><p id="oText">Score: 0</p><button id="oBtn">Play Again</button></div></div>
  </div>
  <div class="hint">Left / right arrows or A-D to switch lanes &middot; touch left/right half &middot; dodge incoming cars</div>

<script src="sfx.js"></script>
<script>
(function () {
  const W = 400, H = 600, LANES = 4, LANE_W = W / LANES;
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay'), oText = document.getElementById('oText');
  const muteBtn = document.getElementById('mute');
  const sfx = window.SFX || { move(){}, explosion(){}, lose(){}, toggleMute(){ return false; } };

  let player, obstacles, score, speed, running, keys = {};
  let best = 0;
  try { best = parseInt(localStorage.getItem('carDodgeBest') || '0', 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;

  function reset() {
    player = { lane: 1, x: 1 * LANE_W + LANE_W/2, targetX: 1 * LANE_W + LANE_W/2, y: H - 100, w: LANE_W - 20, h: 70 };
    obstacles = []; score = 0; speed = 3; running = true;
    scoreEl.textContent = '0'; overlay.classList.remove('show');
  }

  function moveLane(dir) {
    const newLane = player.lane + dir;
    if (newLane >= 0 && newLane < LANES) { player.lane = newLane; player.targetX = newLane * LANE_W + LANE_W/2; sfx.move(); }
  }

  function spawnObstacle() {
    const lane = Math.floor(Math.random() * LANES);
    obstacles.push({ lane, x: lane * LANE_W + LANE_W/2, y: -80, w: LANE_W - 20, h: 70, color: ['#f87171','#67e8f9','#fdba74','#a78bfa'][lane] });
  }

  function loop() { requestAnimationFrame(loop); if (running) update(); draw(); }

  function update() {
    player.x += (player.targetX - player.x) * 0.2;
    for (const obs of obstacles) { obs.y += speed; obs.x = obs.lane * LANE_W + LANE_W/2; }
    obstacles = obstacles.filter(obs => obs.y < H + 100);
    if (Math.random() < 0.02 + score / 20000) spawnObstacle();
    for (const obs of obstacles) {
      if (obs.y + obs.h/2 > player.y - player.h/2 && obs.y - obs.h/2 < player.y + player.h/2 &&
          Math.abs(obs.x - player.x) < (obs.w + player.w) / 2 - 10) { end(); return; }
      if (!obs.passed && obs.y > player.y + player.h/2) { obs.passed = true; score += 10; scoreEl.textContent = score; }
    }
    speed = 3 + score / 500;
  }

  function end() {
    running = false; sfx.explosion(); sfx.lose();
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('carDodgeBest', String(best)); } catch (e) {} }
    oText.textContent = 'Score: ' + score; overlay.classList.add('show');
  }

  function draw() {
    // road
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, '#1a1a22'); gradient.addColorStop(1, '#0a0a0f');
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, W, H);
    // lane lines
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.setLineDash([20, 20]);
    for (let i = 1; i < LANES; i++) { ctx.beginPath(); ctx.moveTo(i * LANE_W, 0); ctx.lineTo(i * LANE_W, H); ctx.stroke(); }
    ctx.setLineDash([]);
    // obstacles
    for (const obs of obstacles) {
      ctx.fillStyle = obs.color; ctx.shadowColor = obs.color; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.roundRect(obs.x - obs.w/2, obs.y - obs.h/2, obs.w, obs.h, 8); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(obs.x - obs.w/2 + 8, obs.y - obs.h/2 + 6, obs.w - 16, 8);
    }
    // player
    ctx.fillStyle = '#6ee7f9'; ctx.shadowColor = '#6ee7f9'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.roundRect(player.x - player.w/2, player.y - player.h/2, player.w, player.h, 8); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(player.x - player.w/2 + 8, player.y - player.h/2 + 6, player.w - 16, 8);
  }

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowleft','a'].includes(k) && !keys.left) { keys.left = true; moveLane(-1); e.preventDefault(); }
    if (['arrowright','d'].includes(k) && !keys.right) { keys.right = true; moveLane(1); e.preventDefault(); }
  });
  document.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (['arrowleft','a'].includes(k)) keys.left = false; if (['arrowright','d'].includes(k)) keys.right = false; });
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = (e.changedTouches[0].clientX - rect.left) * (W / rect.width);
    if (x < W / 2) moveLane(-1); else moveLane(1);
  }, { passive: false });

  document.getElementById('oBtn').addEventListener('click', reset);
  muteBtn.addEventListener('click', () => { const m = sfx.toggleMute(); muteBtn.textContent = 'Sound: ' + (m ? 'Off' : 'On'); });

  reset();
  loop();
})();
</script>
</body>
</html>
