<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; align-items: center; }
  .hud span b { color: #6ee7f9; }
  .wrap { position: relative; }
  canvas { background: #0a0e1a; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 0 60px rgba(110,231,249,0.10); touch-action: none; max-width: 100%; display: block; }
  button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8; padding: 8px 18px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  button:hover { background: rgba(110,231,249,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(9,11,20,0.82); border-radius: 12px; }
  #overlay.show { display: flex; }
  #overlay .panel { text-align: center; padding: 24px 32px; }
  #overlay h2 { font-size: 1.8rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 16px; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Pong</h1>
  <div class="hud">
    <span>You: <b id="pScore">0</b></span>
    <span>CPU: <b id="cScore">0</b></span>
    <button id="mute">Sound: On</button>
  </div>
  <div class="wrap">
    <canvas id="game" width="640" height="400"></canvas>
    <div id="overlay"><div class="panel"><h2 id="oTitle">You Win!</h2><p id="oText">First to 7</p><button id="oBtn">Play Again</button></div></div>
  </div>
  <div class="hint">Mouse / touch / W-S / arrows to move &middot; first to 7 wins</div>

<script src="sfx.js"></script>
<script>
(function () {
  const W = 640, H = 400, WIN = 7;
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const pScoreEl = document.getElementById('pScore'), cScoreEl = document.getElementById('cScore');
  const overlay = document.getElementById('overlay'), oTitle = document.getElementById('oTitle'), oText = document.getElementById('oText');
  const muteBtn = document.getElementById('mute');
  const sfx = window.SFX || { blip(){}, hit(){}, win(){}, lose(){}, toggleMute(){ return false; } };

  const PADDLE_H = 78, PADDLE_W = 12, MARGIN = 22;
  let py, cy, ball, pScore, cScore, running, keys = { up: false, down: false }, mouseY = null;

  function reset(full) {
    if (full) { pScore = 0; cScore = 0; pScoreEl.textContent = '0'; cScoreEl.textContent = '0'; overlay.classList.remove('show'); running = true; }
    py = H/2 - PADDLE_H/2; cy = H/2 - PADDLE_H/2;
    serve(Math.random() < 0.5 ? 1 : -1);
  }
  function serve(dir) {
    ball = { x: W/2, y: H/2, vx: dir * 5, vy: (Math.random()*2-1) * 3, r: 8, speed: 5 };
  }

  function loop() {
    requestAnimationFrame(loop);
    if (!running) { draw(); return; }
    // player paddle
    if (mouseY !== null) py += (mouseY - PADDLE_H/2 - py) * 0.3;
    if (keys.up) py -= 7; if (keys.down) py += 7;
    py = Math.max(0, Math.min(H - PADDLE_H, py));
    // cpu paddle (eased, imperfect)
    const target = ball.y - PADDLE_H/2 + (ball.vx > 0 ? (Math.sin(Date.now()/300)*18) : 0);
    cy += Math.max(-5.5, Math.min(5.5, (target - cy) * 0.12));
    cy = Math.max(0, Math.min(H - PADDLE_H, cy));

    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); sfx.blip(700); }
    if (ball.y > H - ball.r) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); sfx.blip(700); }

    // player collision
    if (ball.vx < 0 && ball.x - ball.r < MARGIN + PADDLE_W && ball.x - ball.r > MARGIN - 6 && ball.y > py && ball.y < py + PADDLE_H) {
      bounce(py); ball.x = MARGIN + PADDLE_W + ball.r;
    }
    // cpu collision
    if (ball.vx > 0 && ball.x + ball.r > W - MARGIN - PADDLE_W && ball.x + ball.r < W - MARGIN + 6 && ball.y > cy && ball.y < cy + PADDLE_H) {
      bounce(cy); ball.x = W - MARGIN - PADDLE_W - ball.r;
    }

    if (ball.x < -20) { cScore++; cScoreEl.textContent = cScore; sfx.lose(); point(); }
    else if (ball.x > W + 20) { pScore++; pScoreEl.textContent = pScore; sfx.blip(900); point(); }
    draw();
  }

  function bounce(paddleY) {
    const rel = (ball.y - (paddleY + PADDLE_H/2)) / (PADDLE_H/2);
    ball.speed = Math.min(12, ball.speed + 0.4);
    const angle = rel * 0.9;
    const dir = ball.vx < 0 ? 1 : -1;
    ball.vx = dir * ball.speed * Math.cos(angle);
    ball.vy = ball.speed * Math.sin(angle);
    sfx.hit();
  }

  function point() {
    if (pScore >= WIN || cScore >= WIN) {
      running = false;
      const win = pScore >= WIN;
      oTitle.textContent = win ? 'You Win!' : 'CPU Wins';
      oText.textContent = pScore + ' - ' + cScore;
      overlay.classList.add('show');
      if (win) sfx.win(); else sfx.lose();
    } else {
      serve(ball.x < 0 ? -1 : 1);
    }
  }

  function draw() {
    ctx.fillStyle = '#0a0e1a'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.setLineDash([8, 12]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#6ee7f9'; ctx.shadowColor = '#6ee7f9'; ctx.shadowBlur = 12;
    ctx.fillRect(MARGIN, py, PADDLE_W, PADDLE_H);
    ctx.fillStyle = '#f472b6'; ctx.shadowColor = '#f472b6';
    ctx.fillRect(W - MARGIN - PADDLE_W, cy, PADDLE_W, PADDLE_H);
    ctx.fillStyle = '#e8ecf8'; ctx.shadowColor = '#e8ecf8';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  canvas.addEventListener('mousemove', (e) => { const r = canvas.getBoundingClientRect(); mouseY = (e.clientY - r.top) * (H / r.height); });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); const r = canvas.getBoundingClientRect(); mouseY = (e.touches[0].clientY - r.top) * (H / r.height); }, { passive: false });
  document.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k==='w'||k==='arrowup') keys.up = true; if (k==='s'||k==='arrowdown') keys.down = true; });
  document.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k==='w'||k==='arrowup') keys.up = false; if (k==='s'||k==='arrowdown') keys.down = false; });
  document.getElementById('oBtn').addEventListener('click', () => reset(true));
  muteBtn.addEventListener('click', () => { const m = sfx.toggleMute(); muteBtn.textContent = 'Sound: ' + (m ? 'Off' : 'On'); });

  reset(true);
  loop();
})();
</script>
</body>
</html>
