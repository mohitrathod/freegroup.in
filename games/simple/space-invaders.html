<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; align-items: center; }
  .hud span b { color: #6ee7f9; }
  .wrap { position: relative; }
  canvas { background: #05070f; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 0 60px rgba(74,222,128,0.08); touch-action: none; max-width: 100%; display: block; }
  button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8; padding: 8px 18px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  button:hover { background: rgba(110,231,249,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(9,11,20,0.82); border-radius: 12px; }
  #overlay.show { display: flex; }
  #overlay .panel { text-align: center; padding: 24px 32px; }
  #overlay h2 { font-size: 1.8rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 16px; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Space Invaders</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Wave: <b id="wave">1</b></span>
    <span>Lives: <b id="lives">3</b></span>
    <button id="mute">Sound: On</button>
  </div>
  <div class="wrap">
    <canvas id="game" width="560" height="440"></canvas>
    <div id="overlay"><div class="panel"><h2 id="oTitle">Game Over</h2><p id="oText">Score: 0</p><button id="oBtn">Play Again</button></div></div>
  </div>
  <div class="hint">Arrows / A-D to move &middot; Space to shoot &middot; drag to move + tap to shoot on touch</div>

<script src="sfx.js"></script>
<script>
(function () {
  const W = 560, H = 440;
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), waveEl = document.getElementById('wave'), livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay'), oText = document.getElementById('oText');
  const muteBtn = document.getElementById('mute');
  const sfx = window.SFX || { blip(){}, hit(){}, explosion(){}, lose(){}, levelup(){}, toggleMute(){ return false; } };

  let player, bullets, enemyBullets, aliens, dir, score, wave, lives, running, keys = { l: false, r: false }, cooldown = 0, moveTimer = 0, particles = [];

  function makeAliens(w) {
    aliens = [];
    const rows = 4, cols = 9;
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        aliens.push({ x: 60 + c * 48, y: 50 + r * 38, w: 30, h: 22, alive: true, color: ['#f87171','#facc15','#4ade80','#60a5fa'][r] });
    dir = 1;
  }

  function reset(full) {
    if (full) { score = 0; wave = 1; lives = 3; scoreEl.textContent = '0'; waveEl.textContent = '1'; livesEl.textContent = '3'; overlay.classList.remove('show'); running = true; }
    player = { x: W/2 - 20, y: H - 34, w: 40, h: 16 };
    bullets = []; enemyBullets = []; particles = [];
    makeAliens(wave);
  }

  function shoot() {
    if (cooldown > 0 || !running) return;
    bullets.push({ x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 12 });
    cooldown = 14; sfx.blip(880);
  }

  function boom(x, y, color) {
    for (let i = 0; i < 12; i++) { const a = Math.random()*Math.PI*2, s = 1+Math.random()*3; particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, color }); }
  }

  function loop() {
    requestAnimationFrame(loop);
    if (running) update();
    draw();
  }

  function update() {
    if (keys.l) player.x -= 6; if (keys.r) player.x += 6;
    player.x = Math.max(0, Math.min(W - player.w, player.x));
    if (cooldown > 0) cooldown--;

    for (const b of bullets) b.y -= 9;
    bullets = bullets.filter(b => b.y > -12);
    for (const b of enemyBullets) b.y += 5;
    enemyBullets = enemyBullets.filter(b => b.y < H + 12);

    // alien movement
    const alive = aliens.filter(a => a.alive);
    moveTimer++;
    const speed = Math.max(10, 40 - alive.length - wave * 2);
    if (moveTimer >= speed) {
      moveTimer = 0;
      let hitEdge = false;
      for (const a of alive) { if ((dir > 0 && a.x + a.w > W - 12) || (dir < 0 && a.x < 12)) hitEdge = true; }
      if (hitEdge) { dir *= -1; for (const a of alive) a.y += 18; }
      else for (const a of alive) a.x += dir * 12;
      // random enemy fire
      if (alive.length && Math.random() < 0.4) { const s = alive[Math.floor(Math.random()*alive.length)]; enemyBullets.push({ x: s.x + s.w/2, y: s.y + s.h, w: 4, h: 10 }); }
    }

    // bullet vs alien
    for (const b of bullets) {
      for (const a of alive) {
        if (b.x < a.x + a.w && b.x + b.w > a.x && b.y < a.y + a.h && b.y + b.h > a.y) {
          a.alive = false; b.y = -100; score += 10; scoreEl.textContent = score; sfx.hit(); boom(a.x + a.w/2, a.y + a.h/2, a.color);
        }
      }
    }

    // enemy bullet vs player
    for (const b of enemyBullets) {
      if (b.x < player.x + player.w && b.x + b.w > player.x && b.y < player.y + player.h && b.y + b.h > player.y) {
        b.y = H + 100; lives--; livesEl.textContent = lives; sfx.explosion(); boom(player.x + player.w/2, player.y, '#6ee7f9');
        if (lives <= 0) return end();
      }
    }
    // alien reaches bottom
    for (const a of alive) if (a.y + a.h >= player.y) return end();

    // wave clear
    if (alive.length === 0) { wave++; waveEl.textContent = wave; sfx.levelup(); reset(false); }

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life -= 0.03; }
    particles = particles.filter(p => p.life > 0);
  }

  function end() {
    running = false; sfx.lose();
    oText.textContent = 'Score: ' + score + ' (wave ' + wave + ')';
    overlay.classList.add('show');
  }

  function draw() {
    ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, W, H);
    // stars
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    for (let i = 0; i < 40; i++) { const x = (i * 97) % W, y = (i * 53 + (Date.now()/40)) % H; ctx.fillRect(x, y, 2, 2); }
    // aliens
    for (const a of aliens) { if (!a.alive) continue; ctx.fillStyle = a.color; ctx.shadowColor = a.color; ctx.shadowBlur = 8;
      ctx.fillRect(a.x, a.y, a.w, a.h); ctx.fillStyle = '#05070f'; ctx.shadowBlur = 0;
      ctx.fillRect(a.x + 6, a.y + 7, 5, 5); ctx.fillRect(a.x + a.w - 11, a.y + 7, 5, 5); }
    // player
    ctx.fillStyle = '#6ee7f9'; ctx.shadowColor = '#6ee7f9'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(player.x, player.y + player.h); ctx.lineTo(player.x + player.w/2, player.y); ctx.lineTo(player.x + player.w, player.y + player.h); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#facc15'; for (const b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#f87171'; for (const b of enemyBullets) ctx.fillRect(b.x, b.y, b.w, b.h);
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); }
    ctx.globalAlpha = 1;
  }

  document.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k==='arrowleft'||k==='a') keys.l = true; if (k==='arrowright'||k==='d') keys.r = true; if (k===' ') { e.preventDefault(); shoot(); } });
  document.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k==='arrowleft'||k==='a') keys.l = false; if (k==='arrowright'||k==='d') keys.r = false; });
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); const r = canvas.getBoundingClientRect(); player.x = (e.touches[0].clientX - r.left) * (W / r.width) - player.w/2; player.x = Math.max(0, Math.min(W - player.w, player.x)); }, { passive: false });
  document.getElementById('oBtn').addEventListener('click', () => reset(true));
  muteBtn.addEventListener('click', () => { const m = sfx.toggleMute(); muteBtn.textContent = 'Sound: ' + (m ? 'Off' : 'On'); });

  reset(true);
  loop();
})();
</script>
</body>
</html>
