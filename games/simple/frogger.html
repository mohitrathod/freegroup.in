<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogger — FreeGroup</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2340 0%, #0d1120 55%, #090b14 100%);
    color: #e8ecf8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #6ee7f9, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hud { display: flex; gap: 22px; font-size: 0.95rem; align-items: center; }
  .hud span b { color: #6ee7f9; }
  .wrap { position: relative; }
  canvas { background: #05070f; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 0 60px rgba(74,222,128,0.08); touch-action: none; max-width: 100%; display: block; }
  button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8ecf8; padding: 8px 18px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  button:hover { background: rgba(110,231,249,0.15); }
  .hint { color: #9aa3bf; font-size: 0.8rem; text-align: center; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(9,11,20,0.82); border-radius: 12px; }
  #overlay.show { display: flex; }
  #overlay .panel { text-align: center; padding: 24px 32px; }
  #overlay h2 { font-size: 1.8rem; margin-bottom: 8px; }
  #overlay p { color: #9aa3bf; margin-bottom: 16px; }
.fg-back{position:fixed;z-index:99;top:10px;left:10px;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,17,32,.78);color:#e8ecf8;text-decoration:none;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
.fg-back:hover{background:rgba(110,231,249,.2)}
.fg-back:focus-visible{outline:2px solid #6ee7f9;outline-offset:2px}
</style>
</head>
<body>
  <a class="fg-back" href="index.html">← Mini Games</a>
  <h1>Frogger</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
    <span>Lives: <b id="lives">3</b></span>
    <button id="mute">Sound: On</button>
  </div>
  <div class="wrap">
    <canvas id="game" width="416" height="480"></canvas>
    <div id="overlay"><div class="panel"><h2 id="oTitle">Game Over</h2><p id="oText">Score: 0</p><button id="oBtn">Play Again</button></div></div>
  </div>
  <div class="hint">Arrows / WASD or swipe to hop &middot; cross the road and river to the goal</div>

<script src="sfx.js"></script>
<script>
(function () {
  const TILE = 32, COLS = 13, ROWS = 15;
  const W = COLS * TILE, H = ROWS * TILE;
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay'), oText = document.getElementById('oText'), oTitle = document.getElementById('oTitle');
  const muteBtn = document.getElementById('mute');
  const sfx = window.SFX || { move(){}, hit(){}, win(){}, lose(){}, levelup(){}, toggleMute(){ return false; } };

  // rows: 0 = goal, 1-5 = river (logs), 6 = safe median, 7-12 = road (cars), 13-14 = start
  let frog, lanes, score, lives, running, maxRow, level;
  let best = 0;
  try { best = parseInt(localStorage.getItem('froggerBest') || '0', 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;

  function buildLanes() {
    lanes = [];
    for (let r = 0; r < ROWS; r++) lanes[r] = null;
    const speedBase = 0.6 + level * 0.15;
    // river logs (rows 1-5)
    for (let r = 1; r <= 5; r++) {
      const dir = r % 2 === 0 ? 1 : -1;
      const len = 2 + (r % 3);
      lanes[r] = { type: 'log', dir, speed: (speedBase + Math.random()*0.4), items: makeItems(len, 3 + (r%2)), len };
    }
    // road cars (rows 7-12)
    for (let r = 7; r <= 12; r++) {
      const dir = r % 2 === 0 ? -1 : 1;
      lanes[r] = { type: 'car', dir, speed: (speedBase + Math.random()*0.6), items: makeItems(1, 3 + (r%3)), len: 1 };
    }
  }

  function makeItems(len, count) {
    const items = []; const gap = COLS / count;
    for (let i = 0; i < count; i++) items.push({ x: i * gap + Math.random(), len });
    return items;
  }

  function reset(full) {
    if (full) { score = 0; lives = 3; level = 1; scoreEl.textContent = '0'; livesEl.textContent = '3'; overlay.classList.remove('show'); }
    frog = { c: 6, r: 14, px: 6 * TILE, py: 14 * TILE, onLog: null };
    maxRow = 14; buildLanes(); running = true;
  }

  function hopTo(c, r) {
    if (r < 0 || r >= ROWS || c < 0 >= COLS) return;
    if (c < 0 || c >= COLS) return;
    frog.c = c; frog.r = r; sfx.move();
    if (r < maxRow) { maxRow = r; score += 10; scoreEl.textContent = score; }
    if (r === 0) reachGoal();
  }

  function reachGoal() {
    score += 100; scoreEl.textContent = score; sfx.win(); level++;
    frog = { c: 6, r: 14, px: 6*TILE, py: 14*TILE, onLog: null }; maxRow = 14; buildLanes();
    if (level > 2) { const s = 0; } // difficulty already scales in buildLanes
    sfx.levelup();
  }

  function die() {
    lives--; livesEl.textContent = lives; sfx.lose();
    if (lives <= 0) return end();
    frog = { c: 6, r: 14, px: 6*TILE, py: 14*TILE, onLog: null }; maxRow = Math.min(maxRow, 14);
  }

  function end() {
    running = false;
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('froggerBest', String(best)); } catch (e) {} }
    oTitle.textContent = 'Game Over'; oText.textContent = 'Score: ' + score; overlay.classList.add('show');
  }

  function loop() { requestAnimationFrame(loop); if (running) update(); draw(); }

  function update() {
    // move lane items
    for (let r = 0; r < ROWS; r++) {
      const lane = lanes[r]; if (!lane) continue;
      for (const it of lane.items) {
        it.x += lane.dir * lane.speed * 0.06;
        if (lane.dir > 0 && it.x > COLS) it.x = -it.len;
        if (lane.dir < 0 && it.x < -it.len) it.x = COLS;
      }
    }
    // smooth frog pixel pos
    frog.px += (frog.c * TILE - frog.px) * 0.4;
    frog.py += (frog.r * TILE - frog.py) * 0.4;

    const lane = lanes[frog.r];
    if (lane && lane.type === 'car') {
      for (const it of lane.items) if (frog.c + 0.4 > it.x && frog.c + 0.6 < it.x + it.len && Math.abs(frog.py - frog.r*TILE) < 6) { return die(); }
      // simpler overlap check
      for (const it of lane.items) if (rangesOverlap(frog.c, frog.c + 1, it.x, it.x + it.len)) return die();
    } else if (lane && lane.type === 'log') {
      let on = null;
      for (const it of lane.items) if (rangesOverlap(frog.c + 0.2, frog.c + 0.8, it.x, it.x + it.len)) { on = it; break; }
      if (on) { frog.c += lane.dir * lane.speed * 0.06; if (frog.c < 0 || frog.c > COLS - 1) return die(); }
      else return die(); // fell in water
    }
  }

  function rangesOverlap(a1, a2, b1, b2) { return a1 < b2 && a2 > b1; }

  function draw() {
    // background bands
    for (let r = 0; r < ROWS; r++) {
      let col = '#0d2818';
      if (r === 0) col = '#14532d';
      else if (r >= 1 && r <= 5) col = '#0c1e3a';
      else if (r === 6) col = '#3b2f14';
      else if (r >= 7 && r <= 12) col = '#1a1a22';
      else col = '#3b2f14';
      ctx.fillStyle = col; ctx.fillRect(0, r*TILE, W, TILE);
    }
    // items
    for (let r = 0; r < ROWS; r++) {
      const lane = lanes[r]; if (!lane) continue;
      for (const it of lane.items) {
        const x = it.x * TILE, y = r * TILE, w = it.len * TILE;
        if (lane.type === 'log') { ctx.fillStyle = '#7c4a1e'; roundRect(x, y+5, w, TILE-10, 6); ctx.fill(); ctx.strokeStyle = '#5a3414'; ctx.stroke(); }
        else { ctx.fillStyle = ['#f87171','#67e8f9','#fdba74','#a78bfa'][r % 4]; roundRect(x, y+5, w-6, TILE-10, 5); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x+4, y+9, w-14, 4); }
      }
    }
    // goal markers
    ctx.fillStyle = 'rgba(74,222,128,0.25)'; for (let c = 1; c < COLS; c += 3) ctx.fillRect(c*TILE, 4, TILE, TILE-8);
    // frog
    const fx = frog.px + TILE/2, fy = frog.py + TILE/2;
    ctx.fillStyle = '#4ade80'; ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(fx, fy, TILE/2 - 4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0a0e1a'; ctx.beginPath(); ctx.arc(fx-4, fy-3, 2, 0, Math.PI*2); ctx.arc(fx+4, fy-3, 2, 0, Math.PI*2); ctx.fill();
  }

  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  document.addEventListener('keydown', (e) => {
    if (!running) return; const k = e.key.toLowerCase();
    if (['arrowup','w'].includes(k)) { hopTo(frog.c, frog.r - 1); e.preventDefault(); }
    else if (['arrowdown','s'].includes(k)) { hopTo(frog.c, Math.min(ROWS-1, frog.r + 1)); e.preventDefault(); }
    else if (['arrowleft','a'].includes(k)) { hopTo(Math.max(0, frog.c - 1), frog.r); e.preventDefault(); }
    else if (['arrowright','d'].includes(k)) { hopTo(Math.min(COLS-1, frog.c + 1), frog.r); e.preventDefault(); }
  });
  let ts = null;
  canvas.addEventListener('touchstart', (e) => { ts = { x: e.touches[0].clientX, y: e.touches[0].clientY }; e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    if (!ts || !running) return; const dx = e.changedTouches[0].clientX - ts.x, dy = e.changedTouches[0].clientY - ts.y;
    if (Math.abs(dx) > Math.abs(dy)) { if (dx > 0) hopTo(Math.min(COLS-1, frog.c+1), frog.r); else hopTo(Math.max(0, frog.c-1), frog.r); }
    else { if (dy > 0) hopTo(frog.c, Math.min(ROWS-1, frog.r+1)); else hopTo(frog.c, frog.r-1); }
    ts = null; e.preventDefault();
  }, { passive: false });

  document.getElementById('oBtn').addEventListener('click', () => reset(true));
  muteBtn.addEventListener('click', () => { const m = sfx.toggleMute(); muteBtn.textContent = 'Sound: ' + (m ? 'Off' : 'On'); });

  reset(true);
  loop();
})();
</script>
</body>
</html>
